      about: '\u05E8\u05E9\u05D9\u05DE\u05D4 \u05DE\u05E9\u05D5\u05EA\u05E4\u05EA \u05E9\u05DC \u05DE\u05E4\u05DC\u05D2\u05EA \u05D1\u05E0\u05D8 2026 \u05D5\u05D9\u05E9 \u05E2\u05EA\u05D9\u05D3, \u05D1\u05D4\u05D5\u05D1\u05DC\u05EA \u05E0\u05E4\u05EA\u05DC\u05D9 \u05D1\u05E0\u05D8 \u05D5\u05D9\u05D0\u05D9\u05E8 \u05DC\u05E4\u05D9\u05D3. \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-be-yahad.org.il/plans \u2014 16 \u05EA\u05D5\u05DB\u05E0\u05D9\u05D5\u05EA \u05DE\u05D3\u05D9\u05E0\u05D9\u05D5\u05EA \u05E0\u05E4\u05E8\u05D3\u05D5\u05EA \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8\u05D5\u05EA \u05EA\u05D7\u05EA \u05D4\u05DE\u05D5\u05EA\u05D2 "\u05D4\u05E1\u05DB\u05DD \u05D7\u05D3\u05E9": \u05D7\u05D5\u05E7 \u05D4\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD (\u05D4\u05D8\u05D1\u05D5\u05EA \u05D3\u05D9\u05D5\u05E8/\u05EA\u05D7\u05D1\u05D5\u05E8\u05D4/\u05D7\u05D9\u05E0\u05D5\u05DA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD, \u05D1\u05D9\u05D8\u05D5\u05DC \u05D4\u05D8\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD), \u05DE\u05DC\u05D7\u05DE\u05D4 \u05D1\u05E7\u05E8\u05D8\u05DC\u05D9 \u05D4\u05DE\u05D6\u05D5\u05DF (\u05D4\u05D5\u05D6\u05DC\u05EA \u05E1\u05DC \u05D4\u05E7\u05E0\u05D9\u05D9\u05D4 \u05D1-30% \u05EA\u05D5\u05DA 3 \u05E9\u05E0\u05D9\u05DD), 100% \u05DC\u05D9\u05D1\u05D4 \u05EA\u05DE\u05D5\u05E8\u05EA \u05EA\u05E7\u05E6\u05D5\u05D1 \u05E6\u05D9\u05D1\u05D5\u05E8\u05D9 \u05D1\u05D7\u05D9\u05E0\u05D5\u05DA, \u05E4\u05D9\u05E8\u05D5\u05E7 "\u05D4\u05D0\u05D5\u05D8\u05D5\u05E0\u05D5\u05DE\u05D9\u05D4 \u05D4\u05D7\u05E8\u05D3\u05D9\u05EA", \u05D7\u05D5\u05E7\u05D4 \u05E2\u05DC \u05D1\u05E1\u05D9\u05E1 \u05DE\u05D2\u05D9\u05DC\u05EA \u05D4\u05E2\u05E6\u05DE\u05D0\u05D5\u05EA, \u05D5\u05D8\u05D9\u05E4\u05D5\u05DC \u05D1\u05E4\u05E9\u05D9\u05E2\u05D4 \u05DE\u05D0\u05D5\u05E8\u05D2\u05E0\u05EA \u05D1\u05E0\u05D2\u05D1 \u05D5\u05D1\u05D2\u05DC\u05D9\u05DC \u05DB\u05D0\u05D9\u05D5\u05DD \u05D1\u05D9\u05D8\u05D7\u05D5\u05E0\u05D9 \u05DC\u05D0\u05D5\u05DE\u05D9 ("\u05E9\u05D9\u05D8\u05EA \u05D0\u05DC \u05E7\u05D0\u05E4\u05D5\u05E0\u05D4"). \u05D1-8.9.2026 \u05D4\u05D2\u05D9\u05E9\u05D4 \u05E8\u05E9\u05DE\u05D9\u05EA \u05D5\u05D0\u05D9\u05E9\u05E8\u05D4 \u05E9\u05DC\u05D0 \u05EA\u05EA\u05D0\u05D7\u05D3 \u05E2\u05DD \u05D9\u05E9\u05E8 \u05E9\u05DC \u05D2\u05D3\u05D9 \u05D0\u05D9\u05D6\u05E0\u05E7\u05D5\u05D8.',
      goals: ['"\u05D7\u05D5\u05E7 \u05D4\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD": \u05D4\u05E4\u05D9\u05DB\u05EA \u05D4\u05E4\u05D9\u05E8\u05DE\u05D9\u05D3\u05D4 \u2014 \u05D4\u05D8\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD \u05D5\u05DC\u05E2\u05D5\u05D1\u05D3\u05D9\u05DD, \u05DC\u05D0 \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD', '\u05E4\u05D9\u05E8\u05D5\u05E7 "\u05D4\u05D0\u05D5\u05D8\u05D5\u05E0\u05D5\u05DE\u05D9\u05D4 \u05D4\u05D7\u05E8\u05D3\u05D9\u05EA" \u05D5\u05E9\u05D9\u05DC\u05D5\u05D1\u05D4 \u05D1\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05DE\u05DE\u05DC\u05DB\u05EA\u05D9, \u05D1\u05E6\u05D1\u05D0 \u05D5\u05D1\u05E2\u05D1\u05D5\u05D3\u05D4', "\u05D7\u05D5\u05E7\u05D4 \u05E2\u05DC \u05D1\u05E1\u05D9\u05E1 \u05E2\u05E7\u05E8\u05D5\u05E0\u05D5\u05EA \u05DE\u05D2\u05D9\u05DC\u05EA \u05D4\u05E2\u05E6\u05DE\u05D0\u05D5\u05EA \u05D5\u05E2\u05D3\u05EA \u05D7\u05E7\u05D9\u05E8\u05D4 \u05DE\u05DE\u05DC\u05DB\u05EA\u05D9\u05EA \u05DC-7 \u05D1\u05D0\u05D5\u05E7\u05D8\u05D5\u05D1\u05E8"],
      platformUrl: "https://be-yahad.org.il/plans/",
      platform: [
        { topic: "\u05E9\u05D9\u05E8\u05D5\u05EA \u05D5\u05E9\u05D9\u05DC\u05D5\u05D1 \u05D7\u05E8\u05D3\u05D9\u05DD", text: '\u05D7\u05D5\u05E7 \u05D4\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD: \u05E2\u05D3\u05D9\u05E4\u05D5\u05EA \u05D1\u05D3\u05D9\u05D5\u05E8, \u05EA\u05D7\u05D1\u05D5\u05E8\u05D4, \u05D7\u05D9\u05E0\u05D5\u05DA \u05D5\u05D0\u05E8\u05E0\u05D5\u05E0\u05D4 \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD \u05D5\u05DC\u05E2\u05D5\u05D1\u05D3\u05D9\u05DD; \u05D1\u05D9\u05D8\u05D5\u05DC \u05D4\u05D8\u05D1\u05D5\u05EA \u05D4\u05DE\u05E2\u05D5\u05D3\u05D3\u05D5\u05EA \u05D4\u05E9\u05EA\u05DE\u05D8\u05D5\u05EA. \u05D6\u05E8\u05DD \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05DE\u05DE\u05DC\u05DB\u05EA\u05D9 \u05D9\u05D4\u05D9\u05D4 \u05D4\u05D9\u05D7\u05D9\u05D3 \u05D4\u05DE\u05EA\u05D5\u05E7\u05E6\u05D1, \u05E2\u05DD \u05D7\u05D5\u05D1\u05EA 100% \u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05DC\u05D9\u05D1\u05D4 \u2014 "\u05DC\u05D0 \u05DE\u05DE\u05DC\u05DB\u05EA\u05D9, \u05DC\u05D0 \u05E2\u05DC \u05D7\u05E9\u05D1\u05D5\u05E0\u05D9".' },
        { topic: "\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D5\u05E1\u05D3\u05E8 \u05E6\u05D9\u05D1\u05D5\u05E8\u05D9", text: '\u05DE\u05D3\u05D9\u05E0\u05D9\u05D5\u05EA "\u05D0\u05E4\u05E1 \u05D4\u05DB\u05DC\u05D4" \u05D5\u05D2\u05D9\u05D5\u05E1 20,000 \u05D7\u05D9\u05D9\u05DC\u05D9\u05DD \u05E0\u05D5\u05E1\u05E4\u05D9\u05DD; \u05D8\u05D9\u05E4\u05D5\u05DC \u05D1\u05E4\u05E9\u05D9\u05E2\u05D4 \u05DE\u05D0\u05D5\u05E8\u05D2\u05E0\u05EA \u05D1\u05E0\u05D2\u05D1 \u05D5\u05D1\u05D2\u05DC\u05D9\u05DC \u05DB\u05D0\u05D9\u05D5\u05DD \u05D1\u05D9\u05D8\u05D7\u05D5\u05E0\u05D9 \u05DC\u05D0\u05D5\u05DE\u05D9 \u05D1\u05E9\u05D9\u05D8\u05EA "\u05D0\u05DC \u05E7\u05D0\u05E4\u05D5\u05E0\u05D4", \u05DC\u05D0 \u05DB\u05D1\u05E2\u05D9\u05D4 \u05E4\u05DC\u05D9\u05DC\u05D9\u05EA \u05D1\u05DC\u05D1\u05D3.' },
        { topic: "\u05DE\u05DE\u05E9\u05DC \u05D5\u05DB\u05DC\u05DB\u05DC\u05D4", text: '\u05D7\u05D5\u05E7\u05D4 \u05E2\u05DC \u05D1\u05E1\u05D9\u05E1 \u05DE\u05D2\u05D9\u05DC\u05EA \u05D4\u05E2\u05E6\u05DE\u05D0\u05D5\u05EA; \u05D4\u05D2\u05D1\u05DC\u05EA \u05DB\u05D4\u05D5\u05E0\u05EA \u05E8\u05D4"\u05DE \u05DC-8 \u05E9\u05E0\u05D9\u05DD; \u05DE\u05DC\u05D7\u05DE\u05D4 \u05D1\u05E7\u05E8\u05D8\u05DC\u05D9 \u05D4\u05DE\u05D6\u05D5\u05DF \u05DC\u05D4\u05D5\u05D6\u05DC\u05EA \u05E1\u05DC \u05D4\u05E7\u05E0\u05D9\u05D9\u05D4 \u05D1-30% \u05EA\u05D5\u05DA 3 \u05E9\u05E0\u05D9\u05DD; \u05E1\u05D2\u05D9\u05E8\u05EA 7 \u05DE\u05E9\u05E8\u05D3\u05D9 \u05DE\u05DE\u05E9\u05DC\u05D4 \u05D5\u05D1\u05D9\u05D6\u05D5\u05E8 \u05E1\u05DE\u05DB\u05D5\u05D9\u05D5\u05EA \u05DC\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA.' }

      about: '\u05DE\u05E4\u05DC\u05D2\u05EA \u05D4\u05E9\u05DE\u05D0\u05DC \u05D4\u05E6\u05D9\u05D5\u05E0\u05D9 \u05E9\u05D4\u05D5\u05E7\u05DE\u05D4 \u05DE\u05D0\u05D9\u05D7\u05D5\u05D3 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D5\u05DE\u05E8\u05E6 \u05D1-2024 \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D9\u05D0\u05D9\u05E8 \u05D2\u05D5\u05DC\u05DF \u05D5\u05EA\u05D5\u05DE\u05E8 \u05E8\u05D6\u05E0\u05D9\u05E7, \u05E9\u05D5\u05EA\u05E3 \u05DE\u05D9\u05D9\u05E1\u05D3. \u05E1\u05DC\u05D5\u05D2\u05DF: "\u05D4\u05D0\u05D5\u05DE\u05E5 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D1\u05D0\u05DE\u05EA". \u05E0\u05DB\u05D5\u05DF \u05DC-2026 \u05DB-112,376 \u05DE\u05EA\u05E4\u05E7\u05D3\u05D9\u05DD. \u05E7\u05D9\u05D9\u05DE\u05D4 \u05E4\u05E8\u05D9\u05D9\u05DE\u05E8\u05D9\u05D6 \u05D1-20 \u05D1\u05D9\u05D5\u05DC\u05D9 2026 \u05E9\u05D1\u05D4\u05DD \u05E0\u05D1\u05D7\u05E8\u05D5 \u05DC\u05D6\u05D9\u05DE\u05D9, \u05E7\u05E8\u05D9\u05D1 \u05D5\u05E8\u05D9\u05D9\u05D8\u05DF \u05D1\u05E8\u05D0\u05E9 \u05D4\u05E8\u05E9\u05D9\u05DE\u05D4. \u05DE\u05E6\u05E2 \u05E8\u05E9\u05DE\u05D9 \u05DE\u05DC\u05D0 \u05E0\u05E7\u05E8\u05D0 \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05D4\u05D0\u05EA\u05E8 (yes.democrats.org.il), \u05D4\u05DB\u05D5\u05DC\u05DC 13 \u05E7\u05D8\u05D2\u05D5\u05E8\u05D9\u05D5\u05EA \u05DE\u05E4\u05D5\u05E8\u05D8\u05D5\u05EA: \u05D7\u05D9\u05E0\u05D5\u05DA (\u05D7\u05D9\u05E0\u05D5\u05DA \u05DE\u05DE\u05DC\u05DB\u05EA\u05D9-\u05D7\u05E8\u05D3\u05D9 \u05D0\u05D9\u05DB\u05D5\u05EA\u05D9 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DE\u05D9\u05DE\u05D5\u05DF \u05E8\u05E9\u05EA\u05D5\u05EA \u05DE\u05E4\u05DC\u05D2\u05EA\u05D9\u05D5\u05EA), \u05E9\u05D5\u05D5\u05D9\u05D5\u05DF \u05D5\u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4 (\u05E0\u05D9\u05E9\u05D5\u05D0\u05D9\u05DD \u05D0\u05D6\u05E8\u05D7\u05D9\u05D9\u05DD, \u05EA\u05D7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05E9\u05D1\u05EA), \u05DE\u05D3\u05D9\u05E0\u05D9\u05D5\u05EA \u05D7\u05D5\u05E5 (\u05E2\u05E6\u05D9\u05E8\u05EA \u05D4\u05E1\u05D9\u05E4\u05D5\u05D7, \u05E4\u05D9\u05E0\u05D5\u05D9 \u05DE\u05D0\u05D7\u05D6\u05D9\u05DD, \u05E0\u05D5\u05E8\u05DE\u05DC\u05D9\u05D6\u05E6\u05D9\u05D4 \u05E2\u05DD \u05E1\u05E2\u05D5\u05D3\u05D9\u05D4), \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05E4\u05E0\u05D9\u05DD (\u05D3\u05D4-\u05E4\u05D5\u05DC\u05D9\u05D8\u05D9\u05D6\u05E6\u05D9\u05D4 \u05E9\u05DC \u05D4\u05DE\u05E9\u05D8\u05E8\u05D4), \u05D7\u05D1\u05E8\u05D4 \u05E2\u05E8\u05D1\u05D9\u05EA (\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D7\u05D5\u05DE\u05E9 \u05DC\u05E6\u05DE\u05E6\u05D5\u05DD \u05E4\u05E2\u05E8\u05D9\u05DD), \u05E1\u05D1\u05D9\u05D1\u05D4 (\u05D7\u05D5\u05E7 \u05D9\u05E1\u05D5\u05D3 \u05D4\u05E1\u05D1\u05D9\u05D1\u05D4 \u05D5\u05D7\u05D5\u05E7 \u05D0\u05E7\u05DC\u05D9\u05DD), \u05E2\u05D5\u05D8\u05E3/\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4, \u05D1\u05E8\u05D9\u05D0\u05D5\u05EA \u05D4\u05E0\u05E4\u05E9 (\u05DE\u05D8\u05D4 \u05DC\u05D0\u05D5\u05DE\u05D9 \u05DC\u05E9\u05D9\u05E7\u05D5\u05DD \u05E0\u05E4\u05E9\u05D9), \u05D7\u05E7\u05DC\u05D0\u05D5\u05EA, \u05D5\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD ("\u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD", \u05EA\u05D2\u05DE\u05D5\u05DC \u05D5\u05D3\u05D0\u05D9 \u05D5\u05E4\u05E9\u05D5\u05D8 \u05DC\u05DB\u05DC \u05D9\u05D5\u05DD \u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD).',
      goals: ["\u05E2\u05E6\u05D9\u05E8\u05EA \u05D4\u05E1\u05D9\u05E4\u05D5\u05D7 \u05D5\u05E4\u05D9\u05E0\u05D5\u05D9 \u05DE\u05D0\u05D7\u05D6\u05D9\u05DD; \u05D4\u05E1\u05D3\u05E8 \u05DE\u05D3\u05D9\u05E0\u05D9 \u05E2\u05DD \u05D4\u05E4\u05DC\u05E1\u05D8\u05D9\u05E0\u05D9\u05DD", '"\u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD" \u05D5\u05EA\u05D2\u05DE\u05D5\u05DC \u05D4\u05D5\u05D2\u05DF \u05D5\u05D5\u05D3\u05D0\u05D9 \u05DC\u05DB\u05DC \u05D9\u05D5\u05DD \u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD', "\u05E0\u05D9\u05E9\u05D5\u05D0\u05D9\u05DD \u05D0\u05D6\u05E8\u05D7\u05D9\u05D9\u05DD, \u05EA\u05D7\u05D1\u05D5\u05E8\u05D4 \u05E6\u05D9\u05D1\u05D5\u05E8\u05D9\u05EA \u05D1\u05E9\u05D1\u05EA \u05D5\u05E4\u05D9\u05E8\u05D5\u05E7 \u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC \u05D4\u05E8\u05D1\u05E0\u05D5\u05EA"],

      platform: [
        { topic: "\u05DE\u05D3\u05D9\u05E0\u05D9 \u05D5\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF", text: "\u05E2\u05E6\u05D9\u05E8\u05EA \u05D4\u05E1\u05D9\u05E4\u05D5\u05D7, \u05E4\u05D9\u05E0\u05D5\u05D9 \u05DE\u05D0\u05D7\u05D6\u05D9\u05DD \u05D5\u05D7\u05D5\u05D5\u05EA \u05DC\u05D4\u05E4\u05D7\u05EA\u05EA \u05E2\u05D5\u05DE\u05E1 \u05D4\u05D4\u05D2\u05E0\u05D4 \u05D1\u05D9\u05D4\u05D5\u05D3\u05D4 \u05D5\u05E9\u05D5\u05DE\u05E8\u05D5\u05DF, \u05E0\u05D5\u05E8\u05DE\u05DC\u05D9\u05D6\u05E6\u05D9\u05D4 \u05E2\u05DD \u05E1\u05E2\u05D5\u05D3\u05D9\u05D4; \u05E1\u05D2\u05D9\u05E8\u05EA \u05D6\u05D9\u05E8\u05D5\u05EA \u05D4\u05DC\u05D7\u05D9\u05DE\u05D4 (\u05E2\u05D6\u05D4/\u05DC\u05D1\u05E0\u05D5\u05DF/\u05E1\u05D5\u05E8\u05D9\u05D4) \u05D5\u05D4\u05D7\u05D6\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD \u05D4\u05D1\u05D9\u05EA\u05D4; \u05D5\u05E2\u05D3\u05EA \u05D7\u05E7\u05D9\u05E8\u05D4 \u05DE\u05DE\u05DC\u05DB\u05EA\u05D9\u05EA." },

      leader: '\u05D1\u05E0\u05D9 \u05D2\u05E0\u05E5 \u05D5\u05D3\u05D3\u05D9 \u05E9\u05DE\u05D7\u05D9 (\u05DE\u05EA\u05E0\u05D5\u05E2\u05EA "\u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05E0\u05D9\u05E1\u05D8\u05D9\u05DD")',
      color: "#3B4A6B",
      about: '\u05E8\u05E9\u05D9\u05DE\u05EA "\u05DB\u05D7\u05D5\u05DC \u05DC\u05D1\u05DF", \u05DE\u05D5\u05D2\u05E9\u05EA \u05DE\u05D8\u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA "\u05DB\u05D7\u05D5\u05DC \u05DC\u05D1\u05DF \u05D7\u05D5\u05E1\u05DF \u05DC\u05D9\u05E9\u05E8\u05D0\u05DC" \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D1\u05E0\u05D9 \u05D2\u05E0\u05E5. \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E8\u05E9\u05D9\u05DE\u05EA \u05DE\u05D5\u05E2\u05DE\u05D3\u05D9\u05DD) \u05D5\u05DE\u05D4\u05D0\u05EA\u05E8 \u05D4\u05E8\u05E9\u05DE\u05D9 kachollavan.org.il, \u05E9\u05DE\u05E4\u05E8\u05E1\u05DD \u05DE\u05E1\u05E4\u05E8 \u05DE\u05E1\u05DE\u05DB\u05D9 \u05DE\u05D3\u05D9\u05E0\u05D9\u05D5\u05EA \u05E0\u05E4\u05E8\u05D3\u05D9\u05DD: "6 \u05E2\u05E7\u05E8\u05D5\u05E0\u05D5\u05EA \u05DB\u05D7\u05D5\u05DC \u05DC\u05D1\u05DF", \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA "\u05E2\u05D5\u05DC\u05D9\u05DD \u05E6\u05E4\u05D5\u05E0\u05D4" \u05DC\u05E9\u05D9\u05E7\u05D5\u05DD \u05E7\u05E8\u05D9\u05D9\u05EA \u05E9\u05DE\u05D5\u05E0\u05D4 \u05D5\u05D4\u05D2\u05DC\u05D9\u05DC (\u05E2\u05DD \u05D9\u05E2\u05D3 \u05DC\u05D0\u05D5\u05DE\u05D9 \u05DE\u05D5\u05E6\u05D4\u05E8: \u05D9\u05D9\u05E9\u05D5\u05D1 \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D9\u05D5\u05DF \u05D9\u05E9\u05E8\u05D0\u05DC\u05D9\u05DD \u05E0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05E0\u05D2\u05D1 \u05D5\u05D1\u05D2\u05DC\u05D9\u05DC \u05EA\u05D5\u05DA 5 \u05E9\u05E0\u05D9\u05DD, \u05D5\u05DB\u05D9 \u05E2\u05D3 2048 \u05DE\u05D7\u05E6\u05D9\u05EA \u05DE\u05D0\u05D6\u05E8\u05D7\u05D9 \u05D9\u05E9\u05E8\u05D0\u05DC \u05D9\u05EA\u05D2\u05D5\u05E8\u05E8\u05D5 \u05D1\u05E0\u05D2\u05D1 \u05D5\u05D1\u05D2\u05DC\u05D9\u05DC), "\u05DE\u05EA\u05D5\u05D5\u05D4 \u05D4\u05E9\u05D9\u05E8\u05D5\u05EA \u05D4\u05D9\u05E9\u05E8\u05D0\u05DC\u05D9", \u05D5\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA "8 \u05D4\u05E0\u05E7\u05D5\u05D3\u05D5\u05EA \u05DC\u05EA\u05D9\u05E7\u05D5\u05DF \u05D4\u05E9\u05D9\u05E8\u05D5\u05EA \u05D4\u05E6\u05D9\u05D1\u05D5\u05E8\u05D9" \u05E2\u05DD \u05D4\u05E7\u05D3\u05DE\u05D4 \u05D0\u05D9\u05E9\u05D9\u05EA \u05E9\u05DC \u05D2\u05E0\u05E5. \u05D1-9.9.2026 \u05D4\u05D5\u05D2\u05E9\u05D4 \u05E8\u05E9\u05DE\u05D9\u05EA, \u05DC\u05D0\u05D7\u05E8 \u05E9\u05DE\u05D2\u05E2\u05D9 \u05D0\u05D9\u05D7\u05D5\u05D3 \u05E2\u05DD \u05D9\u05D5\u05E2\u05D6 \u05D4\u05E0\u05D3\u05DC \u05D5\u05E2\u05DD "\u05D4\u05D0\u05D7\u05D3\u05D5\u05EA" (\u05E9\u05E4\u05E8\u05E9\u05D4 \u05D1\u05E1\u05D5\u05E4\u05D5 \u05E9\u05DC \u05D3\u05D1\u05E8) \u05DC\u05D0 \u05E6\u05DC\u05D7\u05D5.',
      goals: ["\u05DE\u05D3\u05D9\u05E0\u05D4 \u05D9\u05D4\u05D5\u05D3\u05D9\u05EA \u05D5\u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9\u05EA \u05D7\u05D6\u05E7\u05D4 \u05D5\u05D1\u05D8\u05D5\u05D7\u05D4, \u05E2\u05DD \u05DE\u05E2\u05E8\u05DB\u05EA \u05DE\u05E9\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA \u05D5\u05DE\u05D0\u05D5\u05D6\u05E0\u05EA", "\u05E9\u05D5\u05D5\u05D9\u05D5\u05DF \u05D1\u05E0\u05D8\u05DC: \u05E9\u05D9\u05E8\u05D5\u05EA \u05D7\u05D5\u05D1\u05D4 \u05DC\u05DB\u05D5\u05DC\u05DD \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05DE\u05D5\u05EA\u05D0\u05DE\u05D9\u05DD (\u05E6\u05D1\u05D0\u05D9, \u05DC\u05D0\u05D5\u05DE\u05D9, \u05E7\u05D4\u05D9\u05DC\u05EA\u05D9)", "\u05D9\u05E2\u05D3 \u05DC\u05D0\u05D5\u05DE\u05D9: \u05D9\u05D9\u05E9\u05D5\u05D1 \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D9\u05D5\u05DF \u05D9\u05E9\u05E8\u05D0\u05DC\u05D9\u05DD \u05E0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05E0\u05D2\u05D1 \u05D5\u05D1\u05D2\u05DC\u05D9\u05DC \u05EA\u05D5\u05DA 5 \u05E9\u05E0\u05D9\u05DD"],

        { topic: "\u05DE\u05E9\u05E4\u05D8 \u05D5\u05DE\u05E9\u05D9\u05DC\u05D5\u05EA", text: "\u05E9\u05DE\u05D9\u05E8\u05D4 \u05E2\u05DC \u05DE\u05E2\u05E8\u05DB\u05EA \u05DE\u05E9\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA \u05D5\u05D0\u05D9\u05D6\u05D5\u05DF \u05D1\u05D9\u05DF \u05D4\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA; \u05D4\u05EA\u05E0\u05D2\u05D3\u05D5\u05EA \u05DC\u05D4\u05D9\u05D7\u05DC\u05E9\u05D5\u05EA \u05D4\u05E8\u05E9\u05D5\u05EA \u05D4\u05E9\u05D5\u05E4\u05D8\u05EA \u05D5\u05DC\u05E4\u05D5\u05DC\u05D9\u05D8\u05D9\u05D6\u05E6\u05D9\u05D4 \u05E9\u05DC \u05D0\u05DB\u05D9\u05E4\u05EA \u05D4\u05D7\u05D5\u05E7; \u05E7\u05D9\u05D3\u05D5\u05DD \u05D4\u05E9\u05DC\u05DE\u05EA \u05D7\u05E7\u05D9\u05E7\u05EA \u05D7\u05D5\u05E7 \u05D9\u05E1\u05D5\u05D3: \u05D4\u05D7\u05E7\u05D9\u05E7\u05D4." },
        { topic: "\u05E9\u05D9\u05E8\u05D5\u05EA \u05D5\u05E9\u05D5\u05D5\u05D9\u05D5\u05DF \u05D1\u05E0\u05D8\u05DC", text: "\u05DB\u05DC\u05DC \u05D4\u05E6\u05E2\u05D9\u05E8\u05D9\u05DD \u05D9\u05D7\u05D5\u05D9\u05D1\u05D5 \u05D1\u05E9\u05D9\u05E8\u05D5\u05EA \u2014 \u05E6\u05D1\u05D0\u05D9, \u05DC\u05D0\u05D5\u05DE\u05D9 \u05D0\u05D5 \u05E7\u05D4\u05D9\u05DC\u05EA\u05D9, \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05D4\u05DE\u05D5\u05EA\u05D0\u05DE\u05D9\u05DD \u05DC\u05E6\u05E8\u05DB\u05D9\u05DD \u05D4\u05EA\u05E8\u05D1\u05D5\u05EA\u05D9\u05D9\u05DD \u05E9\u05DC \u05DB\u05DC \u05D0\u05D5\u05DB\u05DC\u05D5\u05E1\u05D9\u05D9\u05D4; \u05EA\u05D2\u05DE\u05D5\u05DC \u05DE\u05D5\u05D2\u05D3\u05DC \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9 \u05D4\u05DE\u05E2\u05E8\u05DA \u05D4\u05E7\u05D3\u05DE\u05D9 \u05D5\u05D4\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD." },
        { topic: "\u05D7\u05D9\u05E0\u05D5\u05DA: \u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05DC\u05D9\u05D1\u05D4 \u05D7\u05D5\u05D1\u05D4 \u05DC\u05DB\u05D5\u05DC\u05DD", text: '\u05DE\u05E1\u05DE\u05DA "\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA" (14 \u05E0\u05E7\u05D5\u05D3\u05D5\u05EA): \u05D7\u05D5\u05E7 "\u05D7\u05D9\u05E0\u05D5\u05DA \u05DC\u05DB\u05DC" \u05D9\u05D2\u05D3\u05D9\u05E8 \u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05D4\u05DE\u05D3\u05D9\u05E0\u05D4 \u05D5\u05E2\u05E7\u05E8\u05D5\u05E0\u05D5\u05EA \u05DC\u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05DC\u05D9\u05D1\u05D4 \u05DE\u05E9\u05D5\u05EA\u05E4\u05EA (\u05E2\u05D1\u05E8\u05D9\u05EA, \u05DE\u05EA\u05DE\u05D8\u05D9\u05E7\u05D4, \u05D0\u05E0\u05D2\u05DC\u05D9\u05EA, \u05D0\u05D6\u05E8\u05D7\u05D5\u05EA, \u05EA\u05E0"\u05DA \u05D5\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4) \u2014 \u05D5\u05E8\u05E7 \u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05E9\u05D9\u05DC\u05DE\u05D3\u05D5 \u05D0\u05EA \u05D4\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D9\u05EA\u05D5\u05E7\u05E6\u05D1\u05D5 \u05D5\u05D9\u05DE\u05D3\u05D3\u05D5 \u05E2\u05DC \u05DB\u05DA. \u05E2\u05E6\u05D9\u05E8\u05EA \u05EA\u05E7\u05E6\u05D5\u05D1 \u05E4\u05D5\u05DC\u05D9\u05D8\u05D9 \u05DC\u05D1\u05EA\u05D9 \u05E1\u05E4\u05E8 \u05E4\u05E8\u05D8\u05D9\u05D9\u05DD \u05E9\u05DC\u05D0 \u05E2\u05D5\u05DE\u05D3\u05D9\u05DD \u05D1\u05DC\u05D9\u05D1\u05D4; \u05E8\u05E7 \u05D1\u05EA\u05D9 \u05E1\u05E4\u05E8 \u05DE\u05DE\u05DC\u05DB\u05EA\u05D9\u05D9\u05DD \u05D9\u05EA\u05D5\u05E7\u05E6\u05D1\u05D5 \u05D1-100%. \u05D4\u05E4\u05D9\u05DB\u05EA \u05DE\u05E1\u05DC\u05D5\u05DC \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05DE\u05DE\u05DC\u05DB\u05EA\u05D9-\u05D7\u05E8\u05D3\u05D9 (\u05DE\u05DE"\u05D7) \u05DC\u05D1\u05E8\u05D9\u05E8\u05EA \u05D4\u05DE\u05D7\u05D3\u05DC \u05DC\u05D4\u05E7\u05DE\u05EA \u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05D7\u05D9\u05E0\u05D5\u05DA \u05D7\u05E8\u05D3\u05D9\u05D9\u05DD \u05D7\u05D3\u05E9\u05D9\u05DD.' },
        { topic: "\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4 \u05D5\u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4", text: '\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA "\u05E2\u05D5\u05DC\u05D9\u05DD \u05E6\u05E4\u05D5\u05E0\u05D4": \u05D7\u05D3\u05E8 \u05DE\u05D9\u05D5\u05DF \u05D1\u05E7\u05E8\u05D9\u05D9\u05EA \u05E9\u05DE\u05D5\u05E0\u05D4 \u05EA\u05D5\u05DA \u05E9\u05E0\u05D4, \u05D4\u05E0\u05D7\u05EA \u05D0\u05E8\u05E0\u05D5\u05E0\u05D4 50% \u05DC\u05E6\u05E2\u05D9\u05E8\u05D9\u05DD \u05DE\u05EA\u05D7\u05EA \u05DC\u05D2\u05D9\u05DC 30, \u05D4\u05E4\u05D9\u05DB\u05EA \u05DE\u05DB\u05DC\u05DC\u05EA \u05EA\u05DC \u05D7\u05D9 \u05DC\u05D0\u05D5\u05E0\u05D9\u05D1\u05E8\u05E1\u05D9\u05D8\u05D4; \u05D7\u05D9\u05D6\u05D5\u05E7 \u05D1\u05E8\u05D9\u05D0\u05D5\u05EA \u05E6\u05D9\u05D1\u05D5\u05E8\u05D9\u05EA; \u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4 "\u05D1\u05E8\u05D5\u05D7 \u05D1\u05D9\u05EA \u05D4\u05DC\u05DC" \u2014 \u05EA\u05DE\u05D9\u05DB\u05D4 \u05D1\u05D4\u05E8\u05D7\u05D1\u05EA \u05E1\u05DE\u05DB\u05D5\u05D9\u05D5\u05EA \u05D4\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA \u05E2\u05DC \u05D0\u05D5\u05E4\u05D9\u05D9\u05DF \u05D1\u05E9\u05D1\u05EA.' }

      color: "#5B3A0E",
      about: `\u05E8\u05E9\u05D9\u05DE\u05EA "\u05D4\u05E6\u05D9\u05D5\u05E0\u05D5\u05EA \u05D4\u05D3\u05EA\u05D9\u05EA \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D1\u05E6\u05DC\u05D0\u05DC \u05E1\u05DE\u05D5\u05D8\u05E8\u05D9\u05E5' \u05D5\u05D6\u05D4\u05D5\u05EA \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05DE\u05E9\u05D4 \u05E4\u05D9\u05D9\u05D2\u05DC\u05D9\u05DF", \u05DE\u05D5\u05D2\u05E9\u05EA \u05DE\u05D8\u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA \u05D4\u05D0\u05D9\u05D7\u05D5\u05D3 \u05D4\u05DC\u05D0\u05D5\u05DE\u05D9-\u05EA\u05E7\u05D5\u05DE\u05D4 \u05D5\u05DE\u05E4\u05DC\u05D2\u05EA \u05D6\u05D4\u05D5\u05EA \u2013 \u05EA\u05E0\u05D5\u05E2\u05D4 \u05D9\u05E9\u05E8\u05D0\u05DC\u05D9\u05EA \u05D9\u05D4\u05D5\u05D3\u05D9\u05EA. \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E4\u05D5\u05E8\u05E1\u05DD 8.9.2026). \u05DE\u05E6\u05E2: "\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD \u05D4\u05D1\u05D9\u05EA\u05D4" (miluim.zionutdatit.digital) \u2014 \u05EA\u05D0\u05E8\u05D9\u05DA \u05E2\u05D3\u05DB\u05D5\u05DF \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05E7\u05D5\u05D3 \u05D4\u05DE\u05E7\u05D5\u05E8: 13.8.2026. \u05DC\u05E6\u05D3 \u05D6\u05D0\u05EA, \u05DE\u05E1\u05E4\u05E8 \u05D7\u05D5\u05D1\u05E8\u05D5\u05EA \u05E0\u05D5\u05E9\u05D0\u05D9\u05D5\u05EA \u05E0\u05D5\u05E1\u05E4\u05D5\u05EA (\u05D3\u05D9\u05D5\u05E8, \u05DE\u05E1\u05EA\u05E0\u05E0\u05D9\u05DD, \u05D8\u05D1\u05E2 \u05D5\u05E1\u05D1\u05D9\u05D1\u05D4 \u2014 q9,q15,q28) \u05D4\u05EA\u05E7\u05D1\u05DC\u05D5 \u05DE\u05D4\u05E2\u05DE\u05D5\u05D3 zionutdatit.org.il/\u05DE\u05E6\u05E2-\u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u2014 \u26A0\uFE0F \u05E2\u05DE\u05D5\u05D3 \u05D6\u05D4 \u05D7\u05E1\u05D5\u05DD \u05DC\u05D2\u05D9\u05E9\u05D4 \u05D9\u05E9\u05D9\u05E8\u05D4 \u05D5\u05DC\u05DC\u05D0 \u05D7\u05D5\u05EA\u05DE\u05EA \u05EA\u05D0\u05E8\u05D9\u05DA \u05DE\u05D0\u05D5\u05DE\u05EA\u05EA; \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D5\u05DE\u05D9\u05D9\u05DF \u05D4\u05DB\u05D9\u05DC \u05D1\u05E2\u05D1\u05E8 \u05D2\u05DD \u05D3\u05E4\u05D9\u05DD \u05DE\u05D9\u05D5\u05E9\u05E0\u05D9\u05DD \u05DE-2022-2023 \u05DC\u05E6\u05D3 \u05EA\u05D5\u05DB\u05DF \u05E2\u05D3\u05DB\u05E0\u05D9, \u05DB\u05DA \u05E9\u05D4\u05EA\u05D0\u05E8\u05D9\u05DA \u05D4\u05DE\u05D3\u05D5\u05D9\u05E7 \u05E9\u05DC \u05D4\u05D7\u05D5\u05D1\u05E8\u05D5\u05EA \u05D4\u05DC\u05DC\u05D5 \u05D0\u05D9\u05E0\u05D5 \u05D5\u05D3\u05D0\u05D9 (\u05D0\u05DD \u05DB\u05D9 \u05EA\u05D5\u05DB\u05E0\u05DF \u05E2\u05E7\u05D1\u05D9 \u05E2\u05DD \u05E2\u05DE\u05D3\u05D5\u05EA \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u05D4\u05D9\u05D3\u05D5\u05E2\u05D5\u05EA \u05DC\u05DE\u05D7\u05D6\u05D5\u05E8 2026). \u05DC\u05E2\u05D5\u05DE\u05EA \u05D6\u05D0\u05EA, \u05D4\u05E2\u05DE\u05D3\u05D4 \u05D1\u05E0\u05D5\u05E9\u05D0 \u05D1\u05D9\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8 \u05D4\u05E2\u05DC\u05D9\u05D5\u05DF (q5) \u05D0\u05D5\u05DE\u05EA\u05D4 \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA \u05D1-16.9.2026 \u05DE\u05D5\u05DC \u05DB\u05EA\u05D1\u05D4 \u05D1\u05D4\u05D0\u05E8\u05E5 \u05E2\u05DC \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DE\u05E9\u05E4\u05D8\u05D9\u05EA \u05E8\u05E9\u05DE\u05D9\u05EA \u05E9\u05D4\u05D5\u05E6\u05D2\u05D4 \u05E2\u05DC \u05D9\u05D3\u05D9 \u05E1\u05DE\u05D5\u05D8\u05E8\u05D9\u05E5' \u05D5\u05E8\u05D5\u05D8\u05DE\u05DF. \u05D1-15.7.2026 \u05D4\u05D5\u05D3\u05D9\u05E2 \u05D4\u05E9\u05E8 \u05D0\u05D5\u05E4\u05D9\u05E8 \u05E1\u05D5\u05E4\u05E8 \u05E2\u05DC \u05E4\u05E8\u05D9\u05E9\u05D4, \u05E2\u05DC \u05E8\u05E7\u05E2 \u05DE\u05D7\u05DC\u05D5\u05E7\u05EA \u05E2\u05DD \u05E1\u05DE\u05D5\u05D8\u05E8\u05D9\u05E5' \u05E1\u05D1\u05D9\u05D1 \u05D7\u05D5\u05E7 \u05D4\u05E7\u05E4\u05D0\u05EA \u05DE\u05E2\u05E6\u05E8\u05D9 \u05E2\u05E8\u05D9\u05E7\u05D9\u05DD \u05D7\u05E8\u05D3\u05D9\u05DD. \u05D1\u05DE\u05D0\u05D9 2026 \u05D7\u05EA\u05DD \u05E4\u05D9\u05D9\u05D2\u05DC\u05D9\u05DF \u05D4\u05E1\u05DB\u05DD \u05E8\u05D9\u05E6\u05D4 \u05DE\u05E9\u05D5\u05EA\u05E4\u05EA \u05E2\u05DD \u05D3"\u05E8 \u05DE\u05D9\u05DB\u05D0\u05DC \u05D1\u05DF \u05D0\u05E8\u05D9, \u05D0\u05DA \u05D1-1.9.2026 \u05D4\u05D5\u05D3\u05D9\u05E2\u05D5 \u05E1\u05DE\u05D5\u05D8\u05E8\u05D9\u05E5' \u05D5\u05E4\u05D9\u05D9\u05D2\u05DC\u05D9\u05DF \u05E2\u05DC \u05E8\u05D9\u05E6\u05D4 \u05D1\u05D1\u05DC\u05D5\u05E7 \u05D8\u05DB\u05E0\u05D9 \u05E2\u05DD \u05D4\u05E6\u05D9\u05D5\u05E0\u05D5\u05EA \u05D4\u05D3\u05EA\u05D9\u05EA \u2014 \u05D5\u05D1\u05E2\u05E7\u05D1\u05D5\u05EA \u05D6\u05D0\u05EA \u05D1\u05DF \u05D0\u05E8\u05D9 (\u05E9\u05DC\u05D8\u05E2\u05E0\u05EA \u05DE\u05E7\u05D5\u05E8\u05D1\u05D9\u05D5 \u05DC\u05D0 \u05E0\u05DC\u05E7\u05D7 \u05D1\u05D7\u05E9\u05D1\u05D5\u05DF \u05D1\u05D4\u05E1\u05DB\u05DD) \u05E2\u05D6\u05D1 \u05D0\u05EA \u05E8\u05E9\u05D9\u05DE\u05EA \u05D6\u05D4\u05D5\u05EA (31.8-2.9.2026); \u05D6\u05D4\u05D5\u05EA \u05D8\u05E2\u05E0\u05D4 \u05DB\u05D9 \u05E9\u05DE\u05D5 \u05DC\u05D0 \u05E2\u05DC\u05D4 \u05DB\u05DC\u05DC \u05D1\u05DE\u05D2\u05E2\u05D9\u05DD.`,
      goals: ['"\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD \u05D4\u05D1\u05D9\u05EA\u05D4": \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA \u05EA\u05DC\u05EA-\u05E9\u05DC\u05D1\u05D9\u05EA \u05DC\u05D2\u05D9\u05D5\u05E1 \u05D7\u05E8\u05D3\u05D9\u05DD \u05DC\u05E6\u05D3 \u05D4\u05D8\u05D1\u05D5\u05EA \u05E0\u05E8\u05D7\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD', '\u05D4\u05D2\u05D1\u05DC\u05EA \u05D0\u05E7\u05D8\u05D9\u05D1\u05D9\u05D6\u05DD \u05E9\u05D9\u05E4\u05D5\u05D8\u05D9: \u05E9\u05D9\u05E0\u05D5\u05D9 \u05DE\u05D9\u05E0\u05D5\u05D9 \u05E9\u05D5\u05E4\u05D8\u05D9\u05DD \u05D5\u05E6\u05DE\u05E6\u05D5\u05DD \u05E1\u05DE\u05DB\u05D5\u05EA \u05D4\u05D9\u05D5\u05E2\u05DE"\u05E9', "\u05D9\u05E2\u05D3\u05D9 \u05D4\u05E8\u05D7\u05E7\u05D4 \u05E9\u05E0\u05EA\u05D9\u05D9\u05DD \u05DC\u05DE\u05E1\u05EA\u05E0\u05E0\u05D9\u05DD \u05D5\u05DE\u05D4\u05D2\u05E8\u05D9\u05DD \u05DC\u05D0 \u05D7\u05D5\u05E7\u05D9\u05D9\u05DD"],
      platformUrl: "https://miluim.zionutdatit.digital/",
      platform: [
        { topic: "\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD \u05D5\u05D2\u05D9\u05D5\u05E1 \u05D7\u05E8\u05D3\u05D9\u05DD", text: '\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA "\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD \u05D4\u05D1\u05D9\u05EA\u05D4": \u05D9\u05D9\u05E2\u05D5\u05DC \u05DE\u05E2\u05E8\u05DA \u05D4\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DD; \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA \u05EA\u05DC\u05EA-\u05E9\u05DC\u05D1\u05D9\u05EA \u05DC\u05D2\u05D9\u05D5\u05E1 \u05D7\u05E8\u05D3\u05D9\u05DD \u2014 \u05D4\u05DB\u05E0\u05D4 (\u05DE\u05DB\u05D9\u05E0\u05D5\u05EA, \u05D9\u05E9\u05D9\u05D1\u05D5\u05EA \u05D4\u05E1\u05D3\u05E8 \u05D7\u05E8\u05D3\u05D9\u05D5\u05EA), \u05E9\u05D9\u05E8\u05D5\u05EA (\u05D4\u05D2\u05D3\u05DC\u05EA \u05D7\u05D8\u05D9\u05D1\u05EA \u05D7\u05E9\u05DE\u05D5\u05E0\u05D0\u05D9\u05DD) \u05D5\u05DE\u05E2\u05D8\u05E4\u05EA (\u05D1\u05EA\u05D9 \u05D7\u05D9\u05D9\u05DC \u05D7\u05E8\u05D3\u05D9\u05DD, \u05DE\u05E2\u05E0\u05E7\u05D9\u05DD); \u05D7\u05D5\u05E7 \u05D9\u05E1\u05D5\u05D3 \u05D4\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD \u05E2\u05DD \u05E2\u05D3\u05D9\u05E4\u05D5\u05EA \u05E0\u05E8\u05D7\u05D1\u05EA \u05D1\u05D3\u05D9\u05D5\u05E8, \u05D0\u05E7\u05D3\u05DE\u05D9\u05D4 \u05D5\u05EA\u05E2\u05E1\u05D5\u05E7\u05D4 \u2014 \u05DB\u05D5\u05DC\u05DC \u05DC\u05D1\u05E0\u05D9/\u05D1\u05E0\u05D5\u05EA \u05D6\u05D5\u05D2.' },
        { topic: "\u05DE\u05E9\u05E4\u05D8", text: '\u05D4\u05D2\u05D1\u05DC\u05EA \u05D0\u05E7\u05D8\u05D9\u05D1\u05D9\u05D6\u05DD \u05E9\u05D9\u05E4\u05D5\u05D8\u05D9 \u05D5\u05E8\u05D9\u05DB\u05D5\u05D6 \u05D4\u05DB\u05D5\u05D7 \u05D1\u05D1\u05D9\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8; \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E9\u05D9\u05D8\u05EA \u05DE\u05D9\u05E0\u05D5\u05D9 \u05D4\u05E9\u05D5\u05E4\u05D8\u05D9\u05DD \u05DC\u05E2\u05DC\u05D9\u05D5\u05DF; \u05E6\u05DE\u05E6\u05D5\u05DD \u05E1\u05DE\u05DB\u05D5\u05EA \u05D4\u05D9\u05D5\u05E2\u05DE"\u05E9; \u05DE\u05D2\u05D1\u05DC\u05D5\u05EA \u05D6\u05DE\u05DF \u05DC\u05E4\u05E1\u05D9\u05E7\u05D4.' },

      about: '\u05E8\u05E9\u05D9\u05DE\u05D4 \u05D7\u05E8\u05D3\u05D9\u05EA-\u05D0\u05E9\u05DB\u05E0\u05D6\u05D9\u05EA \u05D4\u05DE\u05D0\u05D2\u05D3\u05EA \u05D0\u05EA \u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC \u05D5\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4. \u05D1-7-8 \u05D1\u05E1\u05E4\u05D8\u05DE\u05D1\u05E8 2026 \u05E2\u05D1\u05E8\u05D4 \u05DE\u05D4\u05E4\u05DB\u05D4 \u05D1\u05E8\u05D2\u05E2 \u05D4\u05D0\u05D7\u05E8\u05D5\u05DF: \u05DE\u05E0\u05D4\u05D9\u05D2 \u05D4\u05E7\u05D4\u05D9\u05DC\u05D4 \u05D4\u05D7\u05E8\u05D3\u05D9\u05EA-\u05DC\u05D9\u05D8\u05D0\u05D9\u05EA, \u05D4\u05E8\u05D1 \u05D3\u05D1 \u05DC\u05E0\u05D3\u05D5, \u05D4\u05D5\u05E8\u05D4 \u05E2\u05DC \u05D4\u05E1\u05E8\u05EA \u05E9\u05E0\u05D9 \u05D7\u05D1\u05E8\u05D9 \u05DB\u05E0\u05E1\u05EA \u05D5\u05EA\u05D9\u05E7\u05D9\u05DD \u05DE\u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 "\u05E2\u05E7\u05D1 \u05D4\u05E6\u05D5\u05E8\u05DA \u05DC\u05E2\u05E9\u05D5\u05EA \u05E8\u05E2\u05E0\u05D5\u05DF" \u2014 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DD \u05DE\u05E9\u05D4 \u05D2\u05E4\u05E0\u05D9, \u05E9\u05D4\u05D5\u05D7\u05DC\u05E3 \u05D1\u05D4\u05E0\u05D4\u05D2\u05EA \u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4 \u05D1\u05D7"\u05DB \u05D9\u05E2\u05E7\u05D1 \u05D0\u05E9\u05E8. \u05D4\u05E1\u05DB\u05DD \u05D4\u05E8\u05D9\u05E6\u05D4 \u05D4\u05DE\u05D7\u05D5\u05D3\u05E9 \u05DB\u05D5\u05DC\u05DC \u05D4\u05EA\u05D7\u05D9\u05D9\u05D1\u05D5\u05EA \u05DE\u05E4\u05D5\u05E8\u05E9\u05EA \u05DC\u05D3\u05E8\u05D5\u05E9 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D1\u05D7\u05D5\u05E7 \u05D4\u05D2\u05D9\u05D5\u05E1 \u05D1\u05DB\u05DC \u05DE\u05E9\u05D0 \u05D5\u05DE\u05EA\u05DF \u05E7\u05D5\u05D0\u05DC\u05D9\u05E6\u05D9\u05D5\u05E0\u05D9 \u2014 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D1\u05E2\u05DE\u05D3\u05EA \u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4, \u05E9\u05D1\u05E2\u05D1\u05E8 \u05E0\u05D9\u05D4\u05DC\u05D4 \u05DE\u05D2\u05E2\u05D9\u05DD \u05E0\u05E4\u05E8\u05D3\u05D9\u05DD \u05E2\u05DC \u05D7\u05D5\u05E7 \u05E9\u05DB\u05DC\u05DC \u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA \u05D0\u05D9\u05E9\u05D9\u05D5\u05EA. \u05D9\u05E9\u05E8\u05D0\u05DC \u05D0\u05D9\u05D9\u05DB\u05DC\u05E8 \u05E4\u05D9\u05E0\u05D4 \u05DE\u05E7\u05D5\u05DD \u05DC\u05D0\u05DC\u05D9\u05E7\u05D9\u05DD \u05E9\u05D8\u05D0\u05E8\u05E7 \u05DE\u05D1\u05E2\u05DC\u05D6.',
      goals: ["\u05E9\u05DE\u05D9\u05E8\u05D4 \u05E2\u05DC \u05E2\u05D5\u05DC\u05DD \u05D4\u05D9\u05E9\u05D9\u05D1\u05D5\u05EA \u05D5\u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05D7\u05E8\u05D3\u05D9 \u05D4\u05E2\u05E6\u05DE\u05D0\u05D9", "\u05E9\u05DE\u05D9\u05E8\u05EA \u05D4\u05E9\u05D1\u05EA \u05D5\u05D4\u05E6\u05D1\u05D9\u05D5\u05DF \u05D4\u05D9\u05D4\u05D5\u05D3\u05D9 \u05D1\u05DE\u05E8\u05D7\u05D1 \u05D4\u05E6\u05D9\u05D1\u05D5\u05E8\u05D9", "\u05E8\u05D5\u05D5\u05D7\u05EA \u05D4\u05DE\u05E9\u05E4\u05D7\u05D5\u05EA \u05D5\u05D4\u05E6\u05D9\u05D1\u05D5\u05E8 \u05D4\u05D7\u05E8\u05D3\u05D9"],

      ],
      candidates: ["1. \u05D9\u05E2\u05E7\u05D1 \u05D0\u05E9\u05E8 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  2. \u05D9\u05E6\u05D7\u05E7 \u05D9\u05E9\u05DB\u05E8 \u05D2\u05D5\u05DC\u05D3\u05E7\u05E0\u05D5\u05E4\u05E3 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  3. \u05D9\u05E6\u05D7\u05E7 \u05D6\u05D0\u05D1 \u05E4\u05D9\u05E0\u05D3\u05E8\u05D5\u05E1 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]", "4. \u05DE\u05D0\u05D9\u05E8 \u05E4\u05E8\u05D5\u05E9 [\u05D7\u05D5\u05DE\u05EA \u05EA\u05D5\u05E8\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  5. \u05DE\u05E9\u05D4 \u05E2\u05D6\u05E8\u05D9\u05D0\u05DC \u05E8\u05D5\u05D6\u05E0\u05D8\u05DC [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  6. \u05D0\u05DC\u05D9 \u05E9\u05D8\u05D0\u05E8\u05E7 [\u05D7\u05D5\u05DE\u05EA \u05EA\u05D5\u05E8\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]", "7. \u05D9\u05D4\u05D5\u05D3\u05D4 \u05DC\u05D9\u05D9\u05D1 \u05D5\u05D5\u05D9\u05D9\u05E1\u05E4\u05D9\u05E9 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  8. \u05D9\u05D5\u05D0\u05DC \u05D9\u05E2\u05E7\u05D1 \u05D8\u05E1\u05DC\u05E8 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  9. \u05D3\u05D5\u05D3 \u05D6\u05DC\u05E5 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]", "10. \u05D3\u05D5\u05D3 \u05D0\u05D5\u05D7\u05E0\u05D4 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  11. \u05DE\u05E9\u05D4 \u05E8\u05D5\u05D8 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  12. \u05D0\u05DC\u05D9\u05D4\u05D5 \u05D1\u05E8\u05D5\u05DB\u05D9 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]", "13. \u05D9\u05E9\u05E8\u05D0\u05DC \u05E4\u05E8\u05D5\u05E9 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  14. \u05D9\u05E6\u05D7\u05E7 \u05E8\u05D9\u05D9\u05DA [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  15. \u05D9\u05D5\u05E1\u05E3 \u05D1\u05D0\u05D4\u05DD [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]", "16. \u05D9\u05E2\u05E7\u05D1 \u05D0\u05E9\u05E8 \u05D2\u05D5\u05D8\u05E8\u05DE\u05DF [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  17. \u05D9\u05D5\u05E1\u05D9 \u05D3\u05D9\u05D9\u05D8\u05E9 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  18. \u05E9\u05DE\u05D5\u05D0\u05DC \u05D2\u05E8\u05D9\u05E0\u05D1\u05E8\u05D2 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]", "19. \u05D9\u05D7\u05D9\u05D0\u05DC \u05D0\u05E8\u05D9\u05D4 \u05D5\u05D9\u05E0\u05D2\u05E8\u05D8\u05DF [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  20. \u05D9\u05E6\u05D7\u05E7 \u05E8\u05D1\u05D9\u05E5 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  21. \u05E4\u05E8\u05E5 \u05D0\u05D1\u05E8\u05DE\u05D5\u05D1\u05D9\u05E5 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]", "22. \u05DE\u05E0\u05D7\u05DD \u05DE\u05E0\u05D3\u05DC \u05E9\u05E4\u05D9\u05E8\u05D0 [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]  23. \u05D7\u05D9\u05D9\u05DD \u05DE\u05D0\u05D9\u05E8 \u05DB\u05E5 [\u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC]  24. \u05DE\u05E9\u05D4 \u05D3\u05D5\u05D3 \u05DE\u05D5\u05E8\u05D2\u05E0\u05E9\u05D8\u05E8\u05DF [\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4]", "\u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05DE\u05DE\u05E9\u05D9\u05DB\u05D4 \u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E7\u05D5\u05DD 24 (\u05D7\u05DC\u05E7\u05D9 \u05D1\u05E6\u05D9\u05DC\u05D5\u05DD); \u05DE\u05D0\u05D5\u05DE\u05EA \u05DE-gov.il", '\u26A0\uFE0F \u05E9\u05D9\u05DE\u05D5 \u05DC\u05D1: \u05D4\u05E6\u05D9\u05DC\u05D5\u05DD \u05DE\u05E6\u05D9\u05D2 \u05D0\u05EA \u05DE\u05E7\u05D5\u05DD 6 \u05D1\u05E9\u05DD "\u05D0\u05DC\u05D9 \u05E9\u05D8\u05D0\u05E8\u05E7" \u05DE\u05D8\u05E2\u05DD "\u05D7\u05D5\u05DE\u05EA \u05EA\u05D5\u05E8\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC" (\u05EA\u05EA-\u05E8\u05E9\u05D9\u05DE\u05D4 \u05E9\u05DC\u05D9\u05E9\u05D9\u05EA \u05DC\u05E6\u05D3 \u05D0\u05D2\u05D5\u05D3\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC \u05D5\u05D3\u05D2\u05DC \u05D4\u05EA\u05D5\u05E8\u05D4) \u2014 \u05DC\u05D0 "\u05D0\u05DC\u05D9\u05E7\u05D9\u05DD \u05E9\u05D8\u05D0\u05E8\u05E7" \u05DE\u05D1\u05E2\u05DC\u05D6 \u05DB\u05E4\u05D9 \u05E9\u05D3\u05D5\u05D5\u05D7 \u05D1\u05E2\u05D1\u05E8. \u05D9\u05E9 \u05DC\u05D5\u05D5\u05D3\u05D0 \u05D0\u05D9\u05D6\u05D5 \u05D2\u05E8\u05E1\u05D4 \u05E0\u05DB\u05D5\u05E0\u05D4.', '\u05D7"\u05DB \u05D0\u05D5\u05E8\u05D9 \u05DE\u05E7\u05DC\u05D1 \u05DC\u05D0 \u05E0\u05DB\u05DC\u05DC \u05D1\u05E8\u05E9\u05D9\u05DE\u05D4', '\u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05E0\u05E7\u05D1\u05E2\u05EA \u05E2"\u05D9 \u05DE\u05D5\u05E2\u05E6\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC\u05D9 \u05D4\u05EA\u05D5\u05E8\u05D4'],

      leader: "\u05D0\u05D1\u05D9\u05D2\u05D3\u05D5\u05E8 \u05DC\u05D9\u05D1\u05E8\u05DE\u05DF",

      about: '\u05E8\u05E9\u05D9\u05DE\u05EA "\u05D9\u05E9\u05E8\u05D0\u05DC \u05D1\u05D9\u05EA\u05E0\u05D5 \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D0\u05D1\u05D9\u05D2\u05D3\u05D5\u05E8 \u05DC\u05D9\u05D1\u05E8\u05DE\u05DF". \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (7.9.2026) \u05D5\u05DE\u05D4\u05DE\u05E6\u05E2 \u05D4\u05E8\u05E9\u05DE\u05D9 \u05D4\u05DE\u05E4\u05D5\u05E8\u05D8 \u05DE\u05D0\u05D5\u05D3 (beytenu.org.il/party-platform, ~46 \u05D3\u05E7\u05D5\u05EA \u05E7\u05E8\u05D9\u05D0\u05D4): \u05DE\u05D3\u05D9\u05E0\u05D4 \u05D9\u05D4\u05D5\u05D3\u05D9\u05EA-\u05D7\u05D9\u05DC\u05D5\u05E0\u05D9\u05EA \u05E2\u05DD \u05E2\u05DE\u05D3\u05D5\u05EA \u05D7\u05D3\u05D5\u05EA \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8\u05D5\u05EA \u05D1\u05DB\u05DC \u05EA\u05D7\u05D5\u05DD \u2014 \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF ("\u05D0\u05E4\u05E1 \u05D4\u05DB\u05DC\u05D4", \u05E0\u05D9\u05EA\u05D5\u05E7 \u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05DE\u05E2\u05D6\u05D4), \u05DE\u05E9\u05E4\u05D8 \u05D5\u05D7\u05D5\u05E7\u05D4 (\u05D7\u05D5\u05E7\u05D4 \u05E2\u05DC \u05D1\u05E1\u05D9\u05E1 \u05E2\u05D1\u05D5\u05D3\u05EA \u05E8\u05D9\u05D9\u05DB\u05DE\u05DF/\u05E4\u05E8\u05D9\u05D3\u05DE\u05DF/\u05E0\u05D9\u05E1\u05D9\u05DD, \u05D4\u05EA\u05E0\u05D2\u05D3\u05D5\u05EA \u05DC\u05E4\u05E1\u05E7\u05EA \u05D4\u05D4\u05EA\u05D2\u05D1\u05E8\u05D5\u05EA), \u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4 (\u05E0\u05D9\u05E9\u05D5\u05D0\u05D9\u05DD \u05D0\u05D6\u05E8\u05D7\u05D9\u05D9\u05DD, \u05EA\u05D7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05E9\u05D1\u05EA \u05DC\u05E4\u05D9 \u05D4\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA, \u05D1\u05D9\u05D8\u05D5\u05DC \u05E7\u05E6\u05D1\u05D0\u05D5\u05EA \u05D9\u05E9\u05D9\u05D1\u05D5\u05EA), \u05DB\u05DC\u05DB\u05DC\u05D4 (\u05D4\u05E4\u05E8\u05D8\u05D5\u05EA, \u05E4\u05D9\u05E8\u05D5\u05E7 \u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC\u05D9\u05DD), \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05E4\u05E0\u05D9\u05DD (\u05D0\u05E4\u05E1 \u05E1\u05D5\u05D1\u05DC\u05E0\u05D5\u05EA, \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DE\u05E9\u05D8\u05E8\u05D4 \u05E9\u05DC 3 \u05DE\u05D9\u05DC\u05D9\u05D0\u05E8\u05D3 \u05E9"\u05D7), \u05D1\u05E8\u05D9\u05D0\u05D5\u05EA (\u05D1\u05EA\u05D9 \u05D7\u05D5\u05DC\u05D9\u05DD \u05D7\u05D3\u05E9\u05D9\u05DD \u05D1\u05E6\u05E4\u05D5\u05DF/\u05D3\u05E8\u05D5\u05DD, \u05D7\u05D9\u05D6\u05D5\u05E7 \u05DB\u05D5\u05D7 \u05D0\u05D3\u05DD \u05E8\u05E4\u05D5\u05D0\u05D9 \u05D1\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4) \u05D5\u05D3\u05D9\u05D5\u05E8 (\u05D1\u05D9\u05D8\u05D5\u05DC \u05DE\u05D5\u05D3\u05DC "\u05D4\u05E4\u05E8\u05D3\u05D9\u05D2\u05DE\u05D4", \u05DE\u05E2\u05D1\u05E8 \u05DC\u05D1\u05E0\u05D9\u05D9\u05D4 \u05DE\u05EA\u05D5\u05E2\u05E9\u05EA, \u05EA\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05DC\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA). \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u05D0\u05D9\u05E0\u05D4 \u05E2\u05D5\u05E8\u05DB\u05EA \u05E4\u05E8\u05D9\u05D9\u05DE\u05E8\u05D9\u05D6; \u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05E0\u05E7\u05D1\u05E2\u05EA \u05E2"\u05D9 \u05D4\u05D9\u05D5"\u05E8.',
      goals: ["\u05D7\u05D5\u05E7 \u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD \u05D5\u05DB\u05D9\u05E0\u05D5\u05DF \u05D7\u05D5\u05E7\u05D4 \u05DC\u05D9\u05E9\u05E8\u05D0\u05DC \u05E2\u05DC \u05D1\u05E1\u05D9\u05E1 \u05E2\u05D1\u05D5\u05D3\u05EA \u05E8\u05D9\u05D9\u05DB\u05DE\u05DF-\u05E4\u05E8\u05D9\u05D3\u05DE\u05DF-\u05E0\u05D9\u05E1\u05D9\u05DD", "\u05D4\u05E4\u05E8\u05D3\u05EA \u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4: \u05E0\u05D9\u05E9\u05D5\u05D0\u05D9\u05DD \u05D0\u05D6\u05E8\u05D7\u05D9\u05D9\u05DD, \u05D1\u05D9\u05D8\u05D5\u05DC \u05D4\u05DE\u05D5\u05E2\u05E6\u05D5\u05EA \u05D4\u05D3\u05EA\u05D9\u05D5\u05EA", '\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DE\u05E9\u05D8\u05E8\u05D4 \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA \u05E9\u05DC 3 \u05DE\u05D9\u05DC\u05D9\u05D0\u05E8\u05D3 \u05E9"\u05D7, \u05D1\u05D3\u05D2\u05E9 \u05E2\u05DC \u05D4\u05E0\u05D2\u05D1 \u05D5\u05D4\u05E6\u05E4\u05D5\u05DF'],
      platformUrl: "https://beytenu.org.il/party-platform/",
      platform: [
        { topic: "\u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4 \u05D5\u05D7\u05D9\u05E0\u05D5\u05DA", text: "\u05D4\u05E4\u05E8\u05D3\u05EA \u05D3\u05EA \u05D5\u05DE\u05D3\u05D9\u05E0\u05D4: \u05E0\u05D9\u05E9\u05D5\u05D0\u05D9\u05DD \u05D0\u05D6\u05E8\u05D7\u05D9\u05D9\u05DD, \u05EA\u05D7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05E9\u05D1\u05EA \u05DC\u05E4\u05D9 \u05D4\u05D7\u05DC\u05D8\u05EA \u05D4\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA, \u05D1\u05D9\u05D8\u05D5\u05DC \u05E7\u05E6\u05D1\u05D0\u05D5\u05EA \u05DC\u05EA\u05DC\u05DE\u05D9\u05D3\u05D9 \u05D9\u05E9\u05D9\u05D1\u05D5\u05EA; \u05D7\u05D5\u05E7 \u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05DC\u05D9\u05D1\u05D4 \u05DC\u05DB\u05DC \u05EA\u05DC\u05DE\u05D9\u05D3 \u2014 \u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05E9\u05DC\u05D0 \u05D9\u05DC\u05DE\u05D3\u05D5 \u05D0\u05EA \u05D4\u05DC\u05D9\u05D1\u05D4 \u05D1\u05DE\u05DC\u05D5\u05D0\u05D4 \u05DC\u05D0 \u05D9\u05EA\u05D5\u05E7\u05E6\u05D1\u05D5." },
        { topic: "\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF", text: '\u05E2\u05E7\u05E8\u05D5\u05DF "\u05D0\u05E4\u05E1 \u05D4\u05DB\u05DC\u05D4" \u05D5\u05DE\u05DB\u05D4 \u05DE\u05E7\u05D3\u05D9\u05DE\u05D4; \u05E0\u05D9\u05EA\u05D5\u05E7 \u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC \u05DE\u05E2\u05D6\u05D4 (\u05E1\u05D2\u05D9\u05E8\u05EA \u05DE\u05E2\u05D1\u05E8\u05D9\u05DD, \u05E0\u05D9\u05EA\u05D5\u05E7 \u05D7\u05E9\u05DE\u05DC/\u05DE\u05D9\u05DD/\u05D3\u05DC\u05E7) \u05D5\u05D4\u05E2\u05D1\u05E8\u05EA\u05D4 \u05DC\u05D2\u05D5\u05E8\u05DD \u05D1\u05D9\u05E0\u05DC\u05D0\u05D5\u05DE\u05D9; \u05D7\u05D5\u05E7 \u05D2\u05D9\u05D5\u05E1 \u05D7\u05D5\u05D1\u05D4 \u05DC\u05DB\u05D5\u05DC\u05DD \u05E2\u05DD \u05E2\u05E0\u05D9\u05E9\u05D4 \u05D7\u05DE\u05D5\u05E8\u05D4 \u05DC\u05E2\u05E8\u05D9\u05E7\u05D9\u05DD (\u05E9\u05DC\u05D9\u05DC\u05EA \u05D6\u05DB\u05D5\u05EA \u05D4\u05E6\u05D1\u05E2\u05D4, \u05DE\u05E0\u05D9\u05E2\u05EA \u05D9\u05E6\u05D9\u05D0\u05D4 \u05DE\u05D4\u05D0\u05E8\u05E5).' },
        { topic: "\u05DE\u05DE\u05E9\u05DC, \u05DB\u05DC\u05DB\u05DC\u05D4 \u05D5\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05E4\u05E0\u05D9\u05DD", text: '\u05DB\u05D9\u05E0\u05D5\u05DF \u05D7\u05D5\u05E7\u05D4 \u05D5\u05D1\u05D9\u05EA \u05DE\u05E9\u05E4\u05D8 \u05DC\u05D7\u05D5\u05E7\u05D4; \u05D4\u05EA\u05E0\u05D2\u05D3\u05D5\u05EA \u05DC\u05E4\u05E1\u05E7\u05EA \u05D4\u05D4\u05EA\u05D2\u05D1\u05E8\u05D5\u05EA; \u05D4\u05E4\u05E8\u05D8\u05D5\u05EA (\u05E0\u05DE\u05DC \u05D0\u05E9\u05D3\u05D5\u05D3, \u05E9\u05D3\u05D4 \u05EA\u05E2\u05D5\u05E4\u05D4 \u05D7\u05D9\u05E4\u05D4) \u05D5\u05E4\u05D9\u05E8\u05D5\u05E7 \u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC\u05D9\u05DD; \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05DE\u05E9\u05D8\u05E8\u05D4 \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA \u05E9\u05DC 3 \u05DE\u05D9\u05DC\u05D9\u05D0\u05E8\u05D3 \u05E9"\u05D7 \u05E2\u05DD 3,000 \u05E9\u05D5\u05D8\u05E8\u05D9\u05DD \u05E0\u05D5\u05E1\u05E4\u05D9\u05DD, \u05D1\u05D3\u05D2\u05E9 \u05E2\u05DC \u05D4\u05E0\u05D2\u05D1 \u05D5\u05D4\u05E6\u05E4\u05D5\u05DF; \u05D7\u05D9\u05D6\u05D5\u05E7 \u05D1\u05EA\u05D9 \u05D7\u05D5\u05DC\u05D9\u05DD \u05D1\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4.' },
        { topic: "\u05D1\u05E8\u05D9\u05D0\u05D5\u05EA \u05D5\u05D3\u05D9\u05D5\u05E8", text: '\u05D1\u05E8\u05D9\u05D0\u05D5\u05EA: \u05D4\u05E9\u05DC\u05DE\u05EA \u05D1\u05E0\u05D9\u05D9\u05EA \u05E9\u05E0\u05D9 \u05D1\u05EA\u05D9 \u05D7\u05D5\u05DC\u05D9\u05DD \u05D1\u05E6\u05E4\u05D5\u05DF \u05D5\u05D1\u05D3\u05E8\u05D5\u05DD, \u05D4\u05D2\u05D3\u05DC\u05EA \u05DE\u05E1\u05E4\u05E8 \u05D4\u05EA\u05E7\u05E0\u05D9\u05DD \u05DC\u05E8\u05D5\u05E4\u05D0\u05D9\u05DD \u05D1\u05D0\u05D7\u05D9\u05D5\u05EA \u05D1\u05D3\u05D2\u05E9 \u05E2\u05DC \u05D4\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4, \u05E2\u05D3\u05DB\u05D5\u05DF \u05E7\u05D1\u05D5\u05E2 \u05E9\u05DC \u05E1\u05DC \u05D4\u05EA\u05E8\u05D5\u05E4\u05D5\u05EA. \u05D3\u05D9\u05D5\u05E8: \u05D1\u05D9\u05D8\u05D5\u05DC \u05DE\u05D5\u05D3\u05DC "\u05D4\u05E4\u05E8\u05D3\u05D9\u05D2\u05DE\u05D4" (\u05D4\u05E0\u05D7\u05D4 \u05EA\u05DE\u05D5\u05E8\u05EA \u05DE\u05D2\u05D1\u05DC\u05EA \u05DE\u05D7\u05D9\u05E8) \u05DC\u05D8\u05D5\u05D1\u05EA \u05EA\u05D7\u05E8\u05D5\u05EA \u05E2\u05DC \u05D0\u05D9\u05DB\u05D5\u05EA/\u05DE\u05D4\u05D9\u05E8\u05D5\u05EA/\u05DE\u05D7\u05D9\u05E8 \u05E1\u05D5\u05E4\u05D9; \u05DE\u05E2\u05D1\u05E8 \u05DC\u05E9\u05D9\u05D8\u05EA \u05D1\u05E0\u05D9\u05D9\u05D4 \u05DE\u05EA\u05D5\u05E2\u05E9\u05EA; \u05EA\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05DB\u05E1\u05E4\u05D9\u05D9\u05DD (2,500 \u05E9"\u05D7 \u05DC\u05DB\u05DC \u05D9\u05D7\u05D9\u05D3\u05EA \u05D3\u05D9\u05D5\u05E8) \u05DC\u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05DE\u05E7\u05D5\u05DE\u05D9\u05D5\u05EA \u05D5\u05D0\u05D6\u05D5\u05E8\u05D9\u05D5\u05EA \u05E9\u05DE\u05D0\u05D9\u05E6\u05D5\u05EA \u05D1\u05E0\u05D9\u05D9\u05D4; \u05D4\u05D2\u05D3\u05DC\u05EA \u05D4\u05D4\u05D9\u05E6\u05E2 \u05D5\u05D4\u05D4\u05E9\u05E7\u05E2\u05D4 \u05D1\u05E4\u05E8\u05D5\u05D9\u05E7\u05D8\u05D9\u05DD \u05DC\u05D4\u05E9\u05DB\u05E8\u05D4 \u05D0\u05E8\u05D5\u05DB\u05EA \u05D8\u05D5\u05D5\u05D7.' }

      about: `\u05DE\u05E4\u05DC\u05D2\u05D4 \u05E9\u05D4\u05DB\u05E8\u05D9\u05D6\u05D4 \u05E2\u05DC\u05D9\u05D4 \u05D1-15 \u05D1\u05D9\u05D5\u05DC\u05D9 2026 \u05E9\u05E8\u05DF \u05D4\u05E9\u05DB\u05DC, \u05D9\u05D5\u05DD \u05D0\u05D7\u05E8\u05D9 \u05E9\u05D4\u05EA\u05E4\u05D8\u05E8\u05D4 \u05DE\u05EA\u05E4\u05E7\u05D9\u05D3 \u05E1\u05D2\u05E0\u05D9\u05EA \u05E9\u05E8 \u05D4\u05D7\u05D5\u05E5 \u05E2\u05DC \u05E8\u05E7\u05E2 \u05D7\u05D5\u05E7 \u05D4\u05E7\u05E4\u05D0\u05EA \u05DE\u05E2\u05E6\u05E8\u05D9 \u05E2\u05E8\u05D9\u05E7\u05D9\u05DD. \u05DE\u05D0\u05D5\u05DE\u05EA\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05D4\u05DE\u05E6\u05E2 \u05D4\u05E8\u05E9\u05DE\u05D9 (israelfirst.co.il/work-plan), \u05D4\u05DE\u05D7\u05D5\u05DC\u05E7 \u05DC\u05D0\u05E8\u05D1\u05E2\u05D4 \u05E4\u05E8\u05E7\u05D9\u05DD: \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DC\u05D0\u05D5\u05DE\u05D9 ("\u05D7\u05D5\u05E7 \u05E9\u05D9\u05E8\u05D5\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC\u05D9 \u05E9\u05D5\u05D5\u05D9\u05D5\u05E0\u05D9" \u05E2\u05DD \u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD \u05D5\u05EA\u05D2\u05DE\u05D5\u05DC \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD, \u05D1\u05D9\u05D8\u05D5\u05DC \u05D4\u05E1\u05DB\u05DE\u05D9 \u05D0\u05D5\u05E1\u05DC\u05D5, \u05E4\u05D9\u05E8\u05D5\u05E7 \u05D7\u05D9\u05D6\u05D1\u05D0\u05DC\u05DC\u05D4 \u05D5\u05D4\u05E9\u05DE\u05D3\u05EA \u05D9\u05DB\u05D5\u05DC\u05D5\u05EA \u05D7\u05DE\u05D0\u05E1), \u05DB\u05DC\u05DB\u05DC\u05D4 \u05D7\u05D5\u05E4\u05E9\u05D9\u05EA (\u05E6\u05DE\u05E6\u05D5\u05DD \u05D3\u05E8\u05E1\u05D8\u05D9 \u05D1\u05DE\u05E1\u05E4\u05E8 \u05DE\u05E9\u05E8\u05D3\u05D9 \u05D4\u05DE\u05DE\u05E9\u05DC\u05D4, \u05D4\u05D5\u05E8\u05D3\u05EA \u05DE\u05E1 \u05D7\u05D1\u05E8\u05D5\u05EA), \u05D7\u05D9\u05E0\u05D5\u05DA (\u05E9\u05D9\u05D8\u05EA \u05E9\u05D5\u05D1\u05E8\u05D9 \u05D7\u05D9\u05E0\u05D5\u05DA \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD ~60,000 \u05E9\\"\u05D7 \u05DC\u05DE\u05E9\u05E4\u05D7\u05D4), \u05D5\u05D7\u05D9\u05E8\u05D5\u05EA \u05D0\u05D6\u05E8\u05D7\u05D9\u05EA (\u05DC\u05D2\u05DC\u05D9\u05D6\u05E6\u05D9\u05D4 \u05DE\u05DC\u05D0\u05D4 \u05E9\u05DC \u05E7\u05E0\u05D0\u05D1\u05D9\u05E1). \u05D1\u05D9\u05DF \u05DE\u05D9\u05D9\u05E1\u05D3\u05D9 \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4: \u05E4\u05D9\u05E0\u05D9 \u05D1\u05D9\u05E0\u05D5 (\u05DC\u05E9\u05E2\u05D1\u05E8 \u05E8\u05D0\u05E9 \u05DE\u05D8\u05D4 \u05E9\u05D8\u05D7 \u05D0\u05E8\u05E6\u05D9 \u05D1\\"\u05D4\u05D9\u05DE\u05D9\u05DF \u05D4\u05D7\u05D3\u05E9\\" \u05E9\u05DC \u05D1\u05E0\u05D8), \u05D0\u05E8\u05D6 \u05D6\u05D2\u05D9\u05D9\u05D4 (\u05E8\u05E1\\"\u05DF \u05D1\u05DE\u05D9\u05DC' \u05D5\u05E7\u05E6\u05D9\u05DF \u05DE\u05E9\u05D8\u05E8\u05D4 \u05DC\u05E9\u05E2\u05D1\u05E8), \u05D5\u05D3\u05D5\u05D3 \u05D9\u05E2\u05E8\u05D9 (\u05D9\u05D5\\"\u05E8 \\"\u05E7\u05D5\u05DC \u05D9\u05E9\u05E8\u05D0\u05DC\\" \u05D1\u05D4\u05E1\u05EA\u05D3\u05E8\u05D5\u05EA \u05D4\u05E6\u05D9\u05D5\u05E0\u05D9\u05EA \u05D4\u05E2\u05D5\u05DC\u05DE\u05D9\u05EA).`,

      leader: '\u05D3"\u05E8 \u05D9\u05D0\u05D9\u05E8 \u05D0\u05E0\u05E1\u05D1\u05DB\u05E8 (\u05D9\u05D5"\u05E8 \u05D6\u05DE\u05E0\u05D9), \u05D1\u05E0\u05D9\u05D4\u05D5 \u05D4\u05E8 \u05E9\u05DE\u05E9 (\u05DE\u05D9\u05D9\u05E1\u05D3)',

      about: '"\u05D0\u05D5\u05E8\u05D5\u05EA \u05D4\u05E9\u05D7\u05E8 \u2014 \u05DE\u05E4\u05DC\u05D2\u05D4 \u05E9\u05DC \u05DB\u05D5\u05DC\u05DD", \u05D4\u05E0\u05D4\u05DC\u05D4 \u05D6\u05DE\u05E0\u05D9\u05EA \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D3"\u05E8 \u05D9\u05D0\u05D9\u05E8 \u05D0\u05E0\u05E1\u05D1\u05DB\u05E8 (\u05DE\u05E2\u05DC\u05D4 \u05D0\u05D3\u05D5\u05DE\u05D9\u05DD) \u05D5\u05D1\u05E0\u05D9\u05D4\u05D5 \u05D4\u05E8 \u05E9\u05DE\u05E9 (\u05DE\u05D9\u05D9\u05E1\u05D3, \u05DC\u05D5\u05D7\u05DD \u05D2\u05D5\u05DC\u05E0\u05D9 \u05DC\u05E9\u05E2\u05D1\u05E8 \u05D5\u05D7\u05D5\u05D5\u05D0\u05D9 \u05D1\u05E0\u05D2\u05D1). \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05D4\u05DE\u05E6\u05E2 \u05D4\u05E8\u05E9\u05DE\u05D9 (orothashachar.org.il/platform, \u05E2\u05D5\u05D3\u05DB\u05DF 9.8.2026): \u05DE\u05E6\u05E2 \u05D9\u05DE\u05E0\u05D9-\u05DC\u05D9\u05D1\u05E8\u05DC\u05D9-\u05D3\u05EA\u05D9 \u05D0\u05E8\u05D5\u05DA \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8, \u05E9\u05DE\u05D6\u05D4\u05D4 \u05E9\u05DC\u05D5\u05E9\u05D4 "\u05DB\u05D5\u05D7\u05D5\u05EA" \u05E9\u05E6\u05E8\u05D9\u05DA \u05DC\u05D0\u05D6\u05DF \u2014 \u05E7\u05D5\u05D3\u05E9, \u05DC\u05D0\u05D5\u05DE\u05D9\u05D5\u05EA \u05D5\u05DC\u05D9\u05D1\u05E8\u05DC\u05D9\u05D5\u05EA. \u05E2\u05DE\u05D3\u05D5\u05EA \u05D1\u05D5\u05DC\u05D8\u05D5\u05EA \u05D5\u05E9\u05E0\u05D5\u05D9\u05D5\u05EA \u05D1\u05DE\u05D7\u05DC\u05D5\u05E7\u05EA: \u05D4\u05D7\u05DC\u05E4\u05EA \u05E1\u05DE\u05DB\u05D5\u05EA \u05D1\u05D2"\u05E5 \u05D1\u05DE\u05E9\u05D0\u05DC \u05E2\u05DD \u05D1\u05E1\u05DB\u05E1\u05D5\u05DB\u05D9 \u05DE\u05DE\u05E9\u05DC-\u05D1\u05D2"\u05E5 \u05D5\u05D1\u05D7\u05D9\u05E8\u05EA \u05E9\u05D5\u05E4\u05D8\u05D9\u05DD \u05E2"\u05D9 \u05D4\u05E6\u05D9\u05D1\u05D5\u05E8; \u05E2\u05D5\u05E0\u05E9 \u05DE\u05D5\u05D5\u05EA \u05E2\u05DC \u05D8\u05E8\u05D5\u05E8; \u05E4\u05D9\u05E8\u05D5\u05E7 \u05E8\u05E9\u05D5\u05EA \u05DE\u05E7\u05E8\u05E7\u05E2\u05D9 \u05D9\u05E9\u05E8\u05D0\u05DC \u05D5\u05D4\u05E4\u05E9\u05E8\u05EA \u05E7\u05E8\u05E7\u05E2\u05D5\u05EA \u05DE\u05D4\u05D9\u05E8\u05D4; \u05DE\u05E1 \u05E9\u05D8\u05D5\u05D7 \u05D0\u05D7\u05D9\u05D3. \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D3\u05D2\u05DC "\u05D2\u05D9\u05E0\u05D5\u05E1\u05E8" \u05DC\u05E4\u05D9\u05EA\u05D5\u05D7 \u05D4\u05E0\u05D2\u05D1 (\u05D0\u05E0\u05E8\u05D2\u05D9\u05D4 \u05D2\u05E8\u05E2\u05D9\u05E0\u05D9\u05EA SMR + \u05E1\u05D5\u05DC\u05D0\u05E8\u05D9\u05EA, \u05E2\u05E8\u05D9\u05DD \u05D7\u05D3\u05E9\u05D5\u05EA). \u05D1\u05DE\u05D0\u05D9 2026 \u05D4\u05E6\u05D8\u05E8\u05E3 \u05D9\u05D5\u05E0\u05EA\u05DF \u05E4\u05D5\u05DC\u05D0\u05E8\u05D3, \u05DC\u05E6\u05D3 \u05E0\u05D9\u05E1\u05D9\u05DD \u05DC\u05D5\u05E7, \u05D0\u05D1\u05D9\u05D4 \u05E9\u05DC \u05E9\u05E0\u05D9 \u05DC\u05D5\u05E7 \u05D6"\u05DC.',
      goals: ['\u05D0\u05D9\u05D6\u05D5\u05DF \u05D1\u05D9\u05DF \u05E9\u05DC\u05D5\u05E9\u05EA \u05D4"\u05DB\u05D5\u05D7\u05D5\u05EA": \u05E7\u05D5\u05D3\u05E9 (\u05EA\u05D5\u05E8\u05D4 \u05D5\u05D4\u05DC\u05DB\u05D4), \u05DC\u05D0\u05D5\u05DE\u05D9\u05D5\u05EA (\u05E8\u05D9\u05D1\u05D5\u05E0\u05D5\u05EA \u05DE\u05DC\u05D0\u05D4) \u05D5\u05DC\u05D9\u05D1\u05E8\u05DC\u05D9\u05D5\u05EA (\u05D7\u05D9\u05E8\u05D5\u05EA \u05D5\u05E7\u05D9\u05D3\u05DE\u05D4)', '\u05E9\u05D9\u05E8\u05D5\u05EA \u05D7\u05D5\u05D1\u05D4 \u05DC\u05DB\u05D5\u05DC\u05DD ("\u05E6\u05D1\u05D0 \u05D4\u05E2\u05DD") \u2014 \u05DB\u05D5\u05DC\u05DC \u05D4\u05D7\u05E8\u05D3\u05D9\u05DD, \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05D9\u05D9\u05E2\u05D5\u05D3\u05D9\u05D9\u05DD \u05D5\u05DE\u05D5\u05EA\u05D0\u05DE\u05D9\u05DD', '\u05D4\u05E4\u05D9\u05DB\u05EA \u05D9\u05E9\u05E8\u05D0\u05DC \u05DC"\u05DE\u05E2\u05E6\u05DE\u05D4" \u05D1\u05D0\u05DE\u05E6\u05E2\u05D5\u05EA \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA \u05D3\u05D2\u05DC \u05DC\u05E4\u05D9\u05EA\u05D5\u05D7 \u05D4\u05E0\u05D2\u05D1 \u05D5\u05D9\u05D9\u05E2\u05D5\u05DC \u05D4\u05DE\u05DE\u05E9\u05DC'],

      platform: [

      about: '\u05E8\u05E9\u05D9\u05DE\u05EA "\u05D4\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD \u05D5\u05D4\u05DB\u05DC\u05DB\u05DC\u05D9\u05EA", \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D9\u05D5\u05E2\u05D6 \u05D4\u05E0\u05D3\u05DC \u05D5\u05D9\u05E8\u05D5\u05DF \u05D6\u05DC\u05D9\u05DB\u05D4. \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E4\u05D5\u05E8\u05E1\u05DD 7.9.2026, \u05E2\u05D5\u05D3\u05DB\u05DF 9.9.2026): \u05D4\u05D5\u05D2\u05E9\u05D4 \u05D1\u05DE\u05E9\u05D5\u05EA\u05E3 \u05DE\u05D8\u05E2\u05DD "\u05D4\u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD" \u05D5\u05DE\u05D8\u05E2\u05DD "\u05D4\u05DB\u05DC\u05DB\u05DC\u05D9\u05EA \u05D4\u05D7\u05D3\u05E9\u05D4". \u05E9\u05E0\u05D9 \u05DE\u05E6\u05E2\u05D9\u05DD \u05E8\u05E9\u05DE\u05D9\u05D9\u05DD \u05E0\u05E7\u05E8\u05D0\u05D5 \u05D1\u05DE\u05DC\u05D5\u05D0\u05DD: hakalkalit.org (\u05D9\u05D5\u05E7\u05E8 \u05D4\u05DE\u05D7\u05D9\u05D4, \u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC\u05D9\u05DD) \u05D5-themiluimnikim.org.il/platform (\u05D7\u05D5\u05E7 \u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD \u05E2\u05DD \u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA \u05D7\u05DE\u05D5\u05E8\u05D5\u05EA \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD \u2014 \u05DB\u05D5\u05DC\u05DC \u05E9\u05DC\u05D9\u05DC\u05EA \u05D6\u05DB\u05D5\u05EA \u05D4\u05E6\u05D1\u05E2\u05D4, \u05DE\u05E0\u05D9\u05E2\u05EA \u05D9\u05E6\u05D9\u05D0\u05D4 \u05DE\u05D4\u05D0\u05E8\u05E5 \u05D5\u05E9\u05DC\u05D9\u05DC\u05EA \u05E8\u05D9\u05E9\u05D9\u05D5\u05DF \u05E0\u05D4\u05D9\u05D2\u05D4 \u2014 \u05DC\u05E6\u05D3 \u05D4\u05D8\u05D1\u05D5\u05EA \u05E0\u05E8\u05D7\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD: \u05D4\u05E0\u05D7\u05D5\u05EA \u05D1\u05DE\u05E2\u05D5\u05E0\u05D5\u05EA/\u05DE\u05E9\u05DB\u05E0\u05EA\u05D0\u05D5\u05EA/\u05D0\u05E8\u05E0\u05D5\u05E0\u05D4, \u05D7\u05DC\u05D5\u05E7\u05EA \u05E7\u05E8\u05E7\u05E2\u05D5\u05EA, \u05E4\u05D9\u05E6\u05D5\u05D9 \u05DC\u05DE\u05E2\u05E1\u05D9\u05E7\u05D9 \u05DE\u05D9\u05DC\u05D5\u05D0\u05D9\u05DE\u05E0\u05D9\u05E7\u05D9\u05DD).',
      goals: ["\u05DE\u05DC\u05D7\u05DE\u05D4 \u05D1\u05D9\u05D5\u05E7\u05E8 \u05D4\u05DE\u05D7\u05D9\u05D4, \u05D1\u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC\u05D9\u05DD \u05D5\u05D1\u05D1\u05E0\u05E7\u05D9\u05DD", "\u05D7\u05D5\u05E7 \u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD \u05E2\u05DD \u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA \u05D7\u05DE\u05D5\u05E8\u05D5\u05EA \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD \u05D5\u05D4\u05D8\u05D1\u05D5\u05EA \u05E0\u05E8\u05D7\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD", "\u05E0\u05D9\u05D4\u05D5\u05DC \u05DB\u05DC\u05DB\u05DC\u05D9 \u05DE\u05E7\u05E6\u05D5\u05E2\u05D9 \u05D5\u05E9\u05D9\u05E7\u05D5\u05DD \u05EA\u05E7\u05E6\u05D9\u05D1 \u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF"],
      platform: [
        { topic: "\u05D9\u05D5\u05E7\u05E8 \u05D4\u05DE\u05D7\u05D9\u05D4 \u05D5\u05DB\u05DC\u05DB\u05DC\u05D4", text: '\u05E4\u05D9\u05E8\u05D5\u05E7 \u05DE\u05D5\u05E0\u05D5\u05E4\u05D5\u05DC\u05D9\u05DD, \u05D4\u05E4\u05D7\u05EA\u05EA \u05DE\u05E2"\u05DE \u05D4\u05D3\u05E8\u05D2\u05EA\u05D9\u05EA \u05D5\u05D4\u05D5\u05D6\u05DC\u05EA \u05DE\u05D7\u05D9\u05E8\u05D9 \u05D4\u05D3\u05D9\u05D5\u05E8; \u05D4\u05E0\u05D7\u05EA \u05DE\u05E1 \u05D7\u05D1\u05E8\u05D5\u05EA \u05DC\u05D7\u05D1\u05E8\u05D5\u05EA \u05D8\u05DB\u05E0\u05D5\u05DC\u05D5\u05D2\u05D9\u05D4 \u05E9\u05DE\u05E2\u05E1\u05D9\u05E7\u05D5\u05EA \u05DB-70% \u05DE\u05DB\u05D5\u05D7 \u05D4\u05D0\u05D3\u05DD \u05D1\u05E0\u05D2\u05D1, \u05D1\u05D2\u05DC\u05D9\u05DC \u05D0\u05D5 \u05D1\u05E2\u05E8\u05D1\u05D4.' },
        { topic: "\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF", text: '\u05D4\u05EA\u05E0\u05D2\u05D3\u05D5\u05EA \u05DC\u05E0\u05E1\u05D9\u05D2\u05D5\u05EA \u05D5\u05DC\u05DE\u05D3\u05D9\u05E0\u05D4 \u05E4\u05DC\u05E1\u05D8\u05D9\u05E0\u05D9\u05EA, \u05EA\u05DE\u05D9\u05DB\u05D4 \u05D1\u05D4\u05EA\u05D9\u05D9\u05E9\u05D1\u05D5\u05EA, \u05D5\u05D4\u05D7\u05D6\u05E8\u05EA \u05EA\u05E7\u05E6\u05D9\u05D1 \u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DC-7% \u05DE\u05D4\u05EA\u05DE"\u05D2.' },
        { topic: "\u05D2\u05D9\u05D5\u05E1 \u05D5\u05D4\u05D8\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD", text: "\u05D7\u05D5\u05E7 \u05D2\u05D9\u05D5\u05E1 \u05DC\u05DB\u05D5\u05DC\u05DD \u05E2\u05DD \u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA \u05D7\u05DE\u05D5\u05E8\u05D5\u05EA \u05DC\u05DE\u05E9\u05EA\u05DE\u05D8\u05D9\u05DD (\u05E9\u05DC\u05D9\u05DC\u05EA \u05D6\u05DB\u05D5\u05EA \u05D4\u05E6\u05D1\u05E2\u05D4, \u05E8\u05D9\u05E9\u05D9\u05D5\u05DF \u05E0\u05D4\u05D9\u05D2\u05D4, \u05D9\u05E6\u05D9\u05D0\u05D4 \u05DE\u05D4\u05D0\u05E8\u05E5, \u05E7\u05E6\u05D1\u05D0\u05D5\u05EA); \u05D4\u05D8\u05D1\u05D5\u05EA \u05E0\u05E8\u05D7\u05D1\u05D5\u05EA \u05DC\u05DE\u05E9\u05E8\u05EA\u05D9\u05DD \u2014 \u05D4\u05E0\u05D7\u05D5\u05EA \u05DE\u05E2\u05D5\u05E0\u05D5\u05EA/\u05DE\u05E9\u05DB\u05E0\u05EA\u05D0/\u05D0\u05E8\u05E0\u05D5\u05E0\u05D4, \u05D7\u05DC\u05D5\u05E7\u05EA \u05E7\u05E8\u05E7\u05E2\u05D5\u05EA, \u05E4\u05D9\u05E6\u05D5\u05D9 \u05DC\u05DE\u05E2\u05E1\u05D9\u05E7\u05D9\u05DD." }

      leader: "\u05D0\u05D1\u05D9\u05D2\u05D3\u05D5\u05E8 (\u05D0\u05D1\u05D9) \u05DE\u05E2\u05D5\u05D6",
      color: "#701A75",
      small: true,
      about: '\u05DE\u05E4\u05DC\u05D2\u05D4 \u05D3\u05EA\u05D9\u05EA-\u05E9\u05DE\u05E8\u05E0\u05D9\u05EA \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D7"\u05DB \u05D0\u05D1\u05D9\u05D2\u05D3\u05D5\u05E8 (\u05D0\u05D1\u05D9) \u05DE\u05E2\u05D5\u05D6, \u05E9\u05D4\u05D5\u05E7\u05DE\u05D4 \u05D1-2019 \u05D5\u05E8\u05E6\u05D4 \u05D4\u05E4\u05E2\u05DD \u05D1\u05E2\u05E6\u05DE\u05D0\u05D5\u05EA. \u05E1\u05DC\u05D5\u05D2\u05DF: "\u05D7\u05D5\u05E4\u05E9\u05D9 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D9\u05D4\u05D5\u05D3\u05D9". \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E4\u05D5\u05E8\u05E1\u05DD 9.9.2026) \u05D5\u05DE\u05D4\u05D0\u05EA\u05E8 \u05D4\u05E8\u05E9\u05DE\u05D9 (noamlisrael.org.il). \u2705 \u05EA\u05D9\u05E7\u05D5\u05DF: \u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05DE\u05D5\u05D2\u05E9\u05EA \u05E8\u05E9\u05DE\u05D9\u05EA \u05DE\u05D8\u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA "\u05DC\u05D6\u05D5\u05D6" (\u05D4\u05E9\u05DD \u05D4\u05E8\u05E9\u05DE\u05D9 \u05E9\u05DC \u05E0\u05E2\u05DD \u05D1\u05E8\u05E9\u05DD \u05D4\u05DE\u05E4\u05DC\u05D2\u05D5\u05EA) \u05D5\u05DE\u05D8\u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA "\u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA \u2014 \u05DC\u05DE\u05E2\u05DF \u05E2\u05EA\u05D9\u05D3 \u05D9\u05DC\u05D3\u05D9\u05E0\u05D5" (\u05D0\u05DC\u05D9\u05D4\u05D5 \u05E9\u05DC\u05D5\u05DD \u05DC\u05D9\u05D1\u05DE\u05DF \u05D5\u05DC\u05D9\u05D0\u05D5\u05E8\u05D4 \u05D0\u05DC\u05D5\u05DF, \u05D1\u05DE\u05E7\u05D5\u05DE\u05D5\u05EA 3-4) \u2014 \u05DC\u05D0 \u05DE\u05E4\u05DC\u05D2\u05EA "\u05D4\u05E7\u05D4\u05DC" \u05DB\u05E4\u05D9 \u05E9\u05D3\u05D5\u05D5\u05D7 \u05D1\u05E2\u05D1\u05E8; \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D9\u05D5\u05D5\u05D7 \u05D4\u05D9\u05D4 \u05E9\u05D2\u05D5\u05D9. \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E0\u05D3\u05D1\u05DB\u05D9\u05DD \u05DE\u05E8\u05DB\u05D6\u05D9\u05D9\u05DD \u05D1\u05DE\u05E6\u05E2: \u05E4\u05D9\u05E6\u05D5\u05DC \u05D5\u05E6\u05DE\u05E6\u05D5\u05DD \u05DE\u05E2\u05E8\u05DB\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8, \u05DE\u05D4\u05E4\u05DB\u05D4 \u05D1\u05DE\u05E2\u05E8\u05DB\u05EA \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA, \u05D5\u05D4\u05E2\u05E6\u05DE\u05EA \u05D4\u05D6\u05D4\u05D5\u05EA \u05D4\u05D9\u05D4\u05D5\u05D3\u05D9\u05EA.',
      goals: ['\u05EA\u05D9\u05E7\u05D5\u05DF \u05DE\u05E2\u05E8\u05DB\u05EA \u05D4\u05DE\u05E9\u05E4\u05D8: \u05E4\u05E1\u05E7\u05EA \u05D4\u05EA\u05D2\u05D1\u05E8\u05D5\u05EA \u05D5\u05E4\u05D9\u05E6\u05D5\u05DC \u05EA\u05E4\u05E7\u05D9\u05D3 \u05D4\u05D9\u05D5\u05E2\u05DE"\u05E9', '\u05DE\u05D4\u05E4\u05DB\u05EA \u05D7\u05D9\u05E0\u05D5\u05DA: \u05D9\u05D5\u05EA\u05E8 \u05E1\u05DE\u05DB\u05D5\u05EA \u05DC\u05D4\u05D5\u05E8\u05D9\u05DD, \u05E9\u05DB\u05E8 \u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD \u05DC\u05DE\u05D5\u05E8\u05D9\u05DD, \u05DE\u05D0\u05D1\u05E7 \u05D1"\u05D4\u05E0\u05D3\u05E1\u05EA \u05EA\u05D5\u05D3\u05E2\u05D4"', "\u05D4\u05E2\u05E6\u05DE\u05EA \u05D4\u05D6\u05D4\u05D5\u05EA \u05D4\u05D9\u05D4\u05D5\u05D3\u05D9\u05EA \u05D5\u05D4\u05D4\u05D2\u05E0\u05D4 \u05E2\u05DC \u05D0\u05D5\u05E4\u05D9\u05D9\u05D4 \u05D4\u05D9\u05D4\u05D5\u05D3\u05D9 \u05E9\u05DC \u05D4\u05DE\u05D3\u05D9\u05E0\u05D4"],
      platformUrl: "https://www.noamlisrael.org.il/",
      platform: [
        { topic: "\u05DE\u05E9\u05E4\u05D8 \u05D5\u05DE\u05DE\u05E9\u05DC", text: '\u05E4\u05E1\u05E7\u05EA \u05D4\u05EA\u05D2\u05D1\u05E8\u05D5\u05EA \u05E9\u05EA\u05E8\u05E1\u05DF \u05D0\u05EA \u05D9\u05DB\u05D5\u05DC\u05EA \u05D1\u05D2"\u05E5 \u05DC\u05D1\u05D8\u05DC \u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05DB\u05E0\u05E1\u05EA; \u05E4\u05D9\u05E6\u05D5\u05DC \u05EA\u05E4\u05E7\u05D9\u05D3 \u05D4\u05D9\u05D5\u05E2\u05DE"\u05E9 \u05DC\u05D9\u05D5\u05E2\u05E5 \u05D1\u05DC\u05D1\u05D3 \u05DC\u05DC\u05D0 \u05D5\u05D8\u05D5; \u05DE\u05D9\u05E0\u05D5\u05D9\u05D9 \u05D0\u05DE\u05D5\u05DF \u05E9\u05D9\u05D0\u05E4\u05E9\u05E8\u05D5 \u05DC\u05E9\u05E8\u05D9\u05DD \u05DC\u05D4\u05D5\u05E6\u05D9\u05D0 \u05DE\u05D3\u05D9\u05E0\u05D9\u05D5\u05EA \u05DC\u05E4\u05D5\u05E2\u05DC.' },
        { topic: "\u05D7\u05D9\u05E0\u05D5\u05DA", text: '\u05D9\u05D5\u05EA\u05E8 \u05E1\u05DE\u05DB\u05D5\u05EA \u05DC\u05D4\u05D5\u05E8\u05D9\u05DD \u05E2\u05DC \u05EA\u05DB\u05E0\u05D9 \u05D4\u05DC\u05D9\u05DE\u05D5\u05D3, \u05D1\u05D9\u05D8\u05D5\u05DC \u05D0\u05D9\u05D6\u05D5\u05E8\u05D9 \u05E8\u05D9\u05E9\u05D5\u05DD \u05D5\u05D6\u05DB\u05D5\u05EA \u05D5\u05D8\u05D5 \u05E2\u05DC \u05EA\u05DB\u05E0\u05D9\u05DD; \u05E1\u05D9\u05DC\u05D5\u05E7 \u05E2\u05DE\u05D5\u05EA\u05D5\u05EA \u05D6\u05E8\u05D5\u05EA \u05DE\u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05D7\u05D9\u05E0\u05D5\u05DA; \u05E9\u05DB\u05E8 \u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD 12,000 \u05E9"\u05D7 \u05DC\u05DE\u05D5\u05E8\u05D4 \u05DE\u05EA\u05D7\u05D9\u05DC.' },

      leader: "\u05DE\u05D5\u05D8\u05D9 \u05DC\u05D9\u05D9\u05D8\u05E0\u05E8",
      color: "#3F3F46",
      small: true,
      about: '\u05DE\u05E4\u05DC\u05D2\u05D4 \u05D7\u05E8\u05D3\u05D9\u05EA \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05DE\u05D5\u05D8\u05D9 \u05DC\u05D9\u05D9\u05D8\u05E0\u05E8 (\u05D4\u05DE\u05E9\u05E0\u05D4 \u05DC\u05E8\u05D0\u05E9 \u05E2\u05D9\u05E8\u05D9\u05D9\u05EA \u05D1\u05D9\u05EA \u05E9\u05DE\u05E9), \u05E9\u05D4\u05E9\u05D9\u05E7\u05D4 \u05D1-23 \u05D1\u05D0\u05D5\u05D2\u05D5\u05E1\u05D8 \u05D0\u05EA \u05E7\u05DE\u05E4\u05D9\u05D9\u05DF "\u05D4\u05E4\u05E2\u05DD \u05DC\u05D5\u05E7\u05D7\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9\u05D5\u05EA" \u05D1\u05D1\u05D9\u05EA \u05E9\u05DE\u05E9. \u05DE\u05D0\u05D5\u05DE\u05EA\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E4\u05D5\u05E8\u05E1\u05DD 8.9.2026) \u05D5\u05DE\u05D4\u05DE\u05E6\u05E2 \u05D4\u05E8\u05E9\u05DE\u05D9 \u05D4\u05DE\u05DC\u05D0 (hatzibur-haharedi.org/\u05DE\u05E6\u05E2), \u05D4\u05DE\u05D7\u05D5\u05DC\u05E7 \u05DC-8 \u05E4\u05E8\u05E7\u05D9\u05DD: \u05E2\u05D5\u05DC\u05DD \u05D4\u05EA\u05D5\u05E8\u05D4 (\u05D4\u05D2\u05E0\u05D4 \u05E2\u05DC \u05DC\u05D5\u05DE\u05D3\u05D9 \u05EA\u05D5\u05E8\u05D4 \u05DE\u05E4\u05E0\u05D9 \u05DE\u05E2\u05E6\u05E8\u05D9\u05DD \u05D5\u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA), \u05E9\u05D9\u05E8\u05D5\u05EA \u05D7\u05E8\u05D3\u05D9\u05DD (\u05DE\u05D9 \u05E9\u05D0\u05D9\u05E0\u05D5 \u05DC\u05D5\u05DE\u05D3 \u05D9\u05E9\u05E8\u05EA \u05DB\u05D0\u05D6\u05E8\u05D7 \u05E8\u05D2\u05D9\u05DC, \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05DE\u05D5\u05EA\u05D0\u05DE\u05D9\u05DD), \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05E9\u05DC\u05E0\u05D5 (\u05E9\u05DE\u05D9\u05E8\u05D4 \u05E2\u05DC \u05E2\u05E6\u05DE\u05D0\u05D5\u05EA \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05D7\u05E8\u05D3\u05D9 \u05DC\u05E6\u05D3 \u05D7\u05D9\u05D6\u05D5\u05E7 \u05D6\u05E8\u05DD \u05D4\u05DE\u05DE"\u05D7 \u05D5\u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u05D5\u05DE\u05EA\u05DE\u05D8\u05D9\u05E7\u05D4), \u05DE\u05D0\u05D1\u05E7 \u05D1\u05E0\u05E9\u05D9\u05E8\u05D4, \u05E4\u05E8\u05E0\u05E1\u05D4 \u05D1\u05DB\u05D1\u05D5\u05D3, \u05D3\u05D9\u05D5\u05E8 \u05D1\u05E8 \u05D4\u05E9\u05D2\u05D4 (\u05E0\u05D2\u05D3 "\u05E9\u05D9\u05DB\u05D5\u05E0\u05D9 \u05D7\u05E8\u05D3\u05D9\u05DD" \u05DE\u05D1\u05D5\u05D3\u05D3\u05D9\u05DD \u05D1\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4), \u05DE\u05D0\u05D1\u05E7 \u05D1\u05D0\u05E4\u05DC\u05D9\u05D4 \u05E2\u05D3\u05EA\u05D9\u05EA \u05D1\u05E7\u05D1\u05DC\u05D4 \u05DC\u05DE\u05D5\u05E1\u05D3\u05D5\u05EA, \u05D5\u05E2\u05DC\u05D9\u05D9\u05D4 \u05D5\u05E7\u05DC\u05D9\u05D8\u05D4 \u05D7\u05E8\u05D3\u05D9\u05EA.',
      goals: ["\u05D4\u05D2\u05E0\u05D4 \u05E2\u05DC \u05DC\u05D5\u05DE\u05D3\u05D9 \u05D4\u05EA\u05D5\u05E8\u05D4, \u05DC\u05E6\u05D3 \u05D2\u05D9\u05D5\u05E1 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05E9\u05DC \u05DE\u05D9 \u05E9\u05D0\u05D9\u05E0\u05D5 \u05DC\u05D5\u05DE\u05D3 \u05DC\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05DE\u05D5\u05EA\u05D0\u05DE\u05D9\u05DD", "\u05E9\u05DE\u05D9\u05E8\u05D4 \u05E2\u05DC \u05E2\u05E6\u05DE\u05D0\u05D5\u05EA \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05D7\u05E8\u05D3\u05D9 \u05DC\u05E6\u05D3 \u05D7\u05D9\u05D6\u05D5\u05E7 \u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u05D5\u05DE\u05EA\u05DE\u05D8\u05D9\u05E7\u05D4", "\u05DE\u05D0\u05D1\u05E7 \u05D1\u05D0\u05E4\u05DC\u05D9\u05D4 \u05E2\u05D3\u05EA\u05D9\u05EA \u05D1\u05E7\u05D1\u05DC\u05D4 \u05DC\u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05D7\u05D9\u05E0\u05D5\u05DA \u05D7\u05E8\u05D3\u05D9\u05D9\u05DD"],

      platform: [
        { topic: "\u05E2\u05D5\u05DC\u05DD \u05D4\u05EA\u05D5\u05E8\u05D4 \u05D5\u05D2\u05D9\u05D5\u05E1", text: "\u05D4\u05D2\u05E0\u05D4 \u05E2\u05DC \u05DC\u05D5\u05DE\u05D3\u05D9 \u05EA\u05D5\u05E8\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05D9\u05DD \u05DE\u05E4\u05E0\u05D9 \u05DE\u05E2\u05E6\u05E8\u05D9\u05DD \u05D5\u05E1\u05E0\u05E7\u05E6\u05D9\u05D5\u05EA; \u05DE\u05D9 \u05E9\u05D0\u05D9\u05E0\u05D5 \u05DE\u05E7\u05D3\u05D9\u05E9 \u05D7\u05D9\u05D9\u05D5 \u05DC\u05DC\u05D9\u05DE\u05D5\u05D3 \u05EA\u05D5\u05E8\u05D4 \u05D9\u05E9\u05E8\u05EA \u05E9\u05D9\u05E8\u05D5\u05EA \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DB\u05D0\u05D6\u05E8\u05D7 \u05E8\u05D2\u05D9\u05DC, \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05E8\u05D0\u05D5\u05D9\u05D9\u05DD \u05D4\u05DE\u05E9\u05DC\u05D1\u05D9\u05DD \u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05E9\u05DE\u05E2\u05D5\u05EA\u05D9 \u05E2\u05DD \u05D0\u05D5\u05E8\u05D7 \u05D7\u05D9\u05D9\u05DD \u05D7\u05E8\u05D3\u05D9." },
        { topic: "\u05D7\u05D9\u05E0\u05D5\u05DA", text: '\u05E9\u05DE\u05D9\u05E8\u05D4 \u05E2\u05DC \u05E2\u05E6\u05DE\u05D0\u05D5\u05EA \u05D4\u05D7\u05D9\u05E0\u05D5\u05DA \u05D4\u05D7\u05E8\u05D3\u05D9, \u05DC\u05E6\u05D3 \u05D7\u05D9\u05D6\u05D5\u05E7 \u05DE\u05E9\u05DE\u05E2\u05D5\u05EA\u05D9 \u05E9\u05DC \u05D6\u05E8\u05DD \u05D4\u05DE\u05DE"\u05D7 (\u05DE\u05DE\u05DC\u05DB\u05EA\u05D9-\u05D7\u05E8\u05D3\u05D9); \u05D4\u05DB\u05E8\u05D4 \u05DE\u05E4\u05D5\u05E8\u05E9\u05EA \u05D1\u05E6\u05D5\u05E8\u05DA \u05D1\u05DC\u05D9\u05DE\u05D5\u05D3\u05D9 \u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u05D5\u05DE\u05EA\u05DE\u05D8\u05D9\u05E7\u05D4, \u05DE\u05DC\u05DE\u05D3\u05D9\u05DD \u05DE\u05E7\u05E6\u05D5\u05E2\u05D9\u05D9\u05DD \u05D5\u05E2\u05D6\u05E8\u05D4 \u05DC\u05DE\u05EA\u05E7\u05E9\u05D9\u05DD.' },
        { topic: "\u05D3\u05D9\u05D5\u05E8 \u05D5\u05E9\u05D5\u05D5\u05D9\u05D5\u05DF", text: '\u05DE\u05D0\u05D1\u05E7 \u05D1\u05DE\u05D2\u05DE\u05EA "\u05E9\u05D9\u05DB\u05D5\u05E0\u05D9 \u05D7\u05E8\u05D3\u05D9\u05DD" \u05DE\u05D1\u05D5\u05D3\u05D3\u05D9\u05DD \u05D1\u05E4\u05E8\u05D9\u05E4\u05E8\u05D9\u05D4 \u05D1\u05DC\u05D9 \u05EA\u05E2\u05E1\u05D5\u05E7\u05D4; \u05DE\u05D0\u05D1\u05E7 \u05D1\u05D0\u05E4\u05DC\u05D9\u05D4 \u05E2\u05D3\u05EA\u05D9\u05EA \u05D1\u05E7\u05D1\u05DC\u05D4 \u05DC\u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05D7\u05D9\u05E0\u05D5\u05DA \u05D7\u05E8\u05D3\u05D9\u05D9\u05DD.' }

      leader: "\u05D4\u05E8\u05D1 \u05E9\u05DC\u05DE\u05D4 \u05D0\u05DC\u05D1\u05D5\u05D9\u05DD, \u05D4\u05E8\u05D1 \u05D3\u05D1 \u05D1\u05E7\u05E9\u05D8 \u05D5\u05D9\u05E6\u05D7\u05E7 \u05D7\u05DC\u05D4",

      small: true,
      about: '\u05DE\u05E4\u05DC\u05D2\u05D4 \u05DB\u05DC\u05DC-\u05D7\u05E8\u05D3\u05D9\u05EA \u05E9\u05D4\u05D5\u05E9\u05E7\u05D4 \u05D1\u05D9\u05E8\u05D5\u05E9\u05DC\u05D9\u05DD \u05D1\u05D9\u05D5\u05DC\u05D9 2026, \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05D4\u05E8\u05D1 \u05E9\u05DC\u05DE\u05D4 \u05D0\u05DC\u05D1\u05D5\u05D9\u05DD (\u05D7\u05D1\u05E8 \u05DE\u05D5\u05E2\u05E6\u05EA \u05D4\u05E2\u05D9\u05E8 \u05D1\u05E0\u05D9 \u05D1\u05E8\u05E7 \u05D5\u05E8\u05D0\u05E9 \u05D4\u05D0\u05D5\u05E4\u05D5\u05D6\u05D9\u05E6\u05D9\u05D4 \u05D1\u05D4), \u05DC\u05E6\u05D3 \u05D4\u05E8\u05D1 \u05D3\u05D1 \u05D1\u05E7\u05E9\u05D8 \u05D5\u05D9\u05E6\u05D7\u05E7 \u05D7\u05DC\u05D4. \u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05D4\u05D5\u05D2\u05E9\u05D4 \u05DC-gov.il \u05D1-9.9.2026 \u05DE\u05D8\u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA "\u05DE\u05D7\u05E0\u05D4 \u05D9\u05E9\u05E8\u05D0\u05DC" (\u05D4\u05E9\u05DD \u05D4\u05E8\u05E9\u05DE\u05D9 \u05D1\u05E8\u05E9\u05DD \u05D4\u05DE\u05E4\u05DC\u05D2\u05D5\u05EA). \u05E7\u05D9\u05D9\u05DE\u05D4 \u05E4\u05E8\u05D9\u05D9\u05DE\u05E8\u05D9\u05D6 \u05D1\u05D4\u05E9\u05EA\u05EA\u05E4\u05D5\u05EA \u05DB-15,000 \u05DE\u05E6\u05D1\u05D9\u05E2\u05D9\u05DD. \u26A0\uFE0F \u05DC\u05E4\u05D9 \u05D3\u05D9\u05D5\u05D5\u05D7\u05D9\u05DD (bhol.co.il), \u05D1\u05D0\u05D5\u05EA\u05D5 \u05D9\u05D5\u05DD \u05DE\u05DE\u05E9 \u05D7\u05EA\u05DE\u05D4 "\u05D4\u05E7\u05D4\u05DC" \u05E2\u05DC \u05D4\u05E1\u05DB\u05DD \u05DC\u05E8\u05D9\u05E6\u05D4 \u05DE\u05E9\u05D5\u05EA\u05E4\u05EA \u05E2\u05DD \u05DE\u05E4\u05DC\u05D2\u05EA \u05E0\u05E2\u05DD \u05E9\u05DC \u05D0\u05D1\u05D9 \u05DE\u05E2\u05D5\u05D6 \u2014 \u05DE\u05E0\u05D2\u05E0\u05D5\u05DF \u05D4\u05D7\u05D9\u05D1\u05D5\u05E8 \u05D4\u05DE\u05D3\u05D5\u05D9\u05E7 \u05D1\u05D9\u05DF \u05E9\u05EA\u05D9 \u05D4\u05E8\u05E9\u05D9\u05DE\u05D5\u05EA (\u05D0\u05D9\u05D7\u05D5\u05D3 \u05DE\u05DC\u05D0 / \u05D4\u05E1\u05DB\u05DD \u05E2\u05D5\u05D3\u05E4\u05D9\u05DD) \u05D0\u05D9\u05E0\u05D5 \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D4\u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D5\u05D3\u05D5\u05E8\u05E9 \u05DE\u05E2\u05E7\u05D1.',
      goals: ["\u05D1\u05D7\u05D9\u05E8\u05EA \u05E0\u05E6\u05D9\u05D2\u05D9 \u05D4\u05E6\u05D9\u05D1\u05D5\u05E8 \u05D4\u05D7\u05E8\u05D3\u05D9 \u05D1\u05E4\u05E8\u05D9\u05D9\u05DE\u05E8\u05D9\u05D6 \u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9\u05D9\u05DD", "\u05D4\u05D2\u05E0\u05D4 \u05D1\u05D7\u05D5\u05E7 \u05E2\u05DC \u05DC\u05D5\u05DE\u05D3\u05D9 \u05D4\u05EA\u05D5\u05E8\u05D4 \u05DC\u05E6\u05D3 \u05DE\u05E1\u05D2\u05E8\u05EA \u05D2\u05D9\u05D5\u05E1 \u05D7\u05E8\u05D3\u05D9\u05EA \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA", "\u05DE\u05E2\u05E0\u05D4 \u05DC\u05EA\u05E1\u05DB\u05D5\u05DC \u05DE\u05D4\u05D4\u05E0\u05D4\u05D2\u05D4 \u05D4\u05D7\u05E8\u05D3\u05D9\u05EA \u05D4\u05D5\u05D5\u05EA\u05D9\u05E7\u05D4 \u05D1\u05E0\u05D5\u05E9\u05D0 \u05D4\u05D2\u05D9\u05D5\u05E1"],

      about: '\u05E8\u05E9\u05D9\u05DE\u05EA "\u05D4\u05E9\u05D5\u05EA\u05E4\u05D5\u05EA \u05DC\u05DB\u05D5\u05DC\u05DD" \u2014 \u05E9\u05DD \u05D4\u05D1\u05D7\u05D9\u05E8\u05D5\u05EA \u05DC-2026 \u05E9\u05DC \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u05D4\u05D5\u05D5\u05EA\u05D9\u05E7\u05D4 "\u05D0\u05D9\u05D7\u05D5\u05D3 \u05D1\u05E0\u05D9 \u05D4\u05D1\u05E8\u05D9\u05EA" (\u05DE-2013), \u05D1\u05E8\u05D0\u05E9\u05D5\u05EA \u05E8\u05D1 \u05D4\u05D7\u05D5\u05D1\u05DC \u05D1\u05E9\u05D0\u05E8\u05D4 \u05E9\u05DC\u05D9\u05D0\u05DF \u05DE\u05E0\u05E6\u05E8\u05EA. \u05DE\u05D0\u05D5\u05DE\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE\u05D0\u05EA\u05E8 gov.il, \u05E4\u05E8\u05E1\u05D5\u05DD \u05D5\u05E2\u05D3\u05EA \u05D4\u05D1\u05D7\u05D9\u05E8\u05D5\u05EA \u05D4\u05DE\u05E8\u05DB\u05D6\u05D9\u05EA (\u05E4\u05D5\u05E8\u05E1\u05DD 7.9.2026, \u05E2\u05D5\u05D3\u05DB\u05DF 9.9.2026): \u05D1\u05E8\u05D0\u05E9 \u05D4\u05E8\u05E9\u05D9\u05DE\u05D4 \u05D8\u05DC\u05D0\u05DC \u05D0\u05DC\u05E7\u05E8\u05D9\u05E0\u05D0\u05D5\u05D5\u05D9, \u05D5\u05E9\u05DC\u05D9\u05D0\u05DF \u05D1\u05DE\u05E7\u05D5\u05DD \u05D4\u05E9\u05DC\u05D9\u05E9\u05D9. \u05E4\u05D5\u05E2\u05DC\u05EA \u05DC\u05E9\u05D9\u05DC\u05D5\u05D1 \u05DE\u05DC\u05D0 \u05E9\u05DC \u05E0\u05D5\u05E6\u05E8\u05D9\u05DD \u05E2\u05E8\u05D1\u05D9\u05DD \u05D1\u05D7\u05D1\u05E8\u05D4 \u05D4\u05D9\u05E9\u05E8\u05D0\u05DC\u05D9\u05EA. \u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05EA \u05E7\u05D9\u05D1\u05DC\u05D4 \u05D0\u05D7\u05D5\u05D6\u05D9 \u05E7\u05D5\u05DC\u05D5\u05EA \u05D6\u05E0\u05D9\u05D7\u05D9\u05DD \u05D1\u05DB\u05DC \u05DE\u05E2\u05E8\u05DB\u05EA \u05D1\u05D7\u05D9\u05E8\u05D5\u05EA.',
      goals: ["\u05E9\u05D9\u05DC\u05D5\u05D1 \u05DE\u05DC\u05D0 \u05E9\u05DC \u05E0\u05D5\u05E6\u05E8\u05D9\u05DD \u05E2\u05E8\u05D1\u05D9\u05DD \u05D1\u05D7\u05D1\u05E8\u05D4 \u05D5\u05D1\u05DE\u05D3\u05D9\u05E0\u05D4, \u05D1\u05E8\u05D5\u05D7 \u05DE\u05D2\u05D9\u05DC\u05EA \u05D4\u05E2\u05E6\u05DE\u05D0\u05D5\u05EA", '\u05E2\u05D9\u05D3\u05D5\u05D3 \u05D2\u05D9\u05D5\u05E1 \u05E0\u05D5\u05E6\u05E8\u05D9\u05DD \u05D3\u05D5\u05D1\u05E8\u05D9 \u05E2\u05E8\u05D1\u05D9\u05EA \u05DC\u05E6\u05D4"\u05DC', "\u05D2\u05D9\u05E9\u05D5\u05E8 \u05D5\u05D4\u05D1\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05DE\u05D2\u05D6\u05E8\u05D9\u05DD \u05D5\u05D4\u05E7\u05D4\u05D9\u05DC\u05D5\u05EA"],
      platformUrl: null,
      platform: [

      leader: '\u05D4\u05E0\u05D4\u05D2\u05D4 \u05E7\u05D5\u05DC\u05E7\u05D8\u05D9\u05D1\u05D9\u05EA ("\u05D2\u05E9\u05E8 \u05D4\u05E4\u05D9\u05E7\u05D5\u05D3" \u2014 12 \u05E7\u05D1\u05E8\u05E0\u05D9\u05D8\u05D9\u05DD)',

      about: `\u05DE\u05E4\u05DC\u05D2\u05EA \u05D4\u05E4\u05D9\u05E8\u05D0\u05D8\u05D9\u05DD \u05D4\u05D9\u05E9\u05E8\u05D0\u05DC\u05D9\u05EA, \u05D7\u05DC\u05E7 \u05DE\u05EA\u05E0\u05D5\u05E2\u05EA \u05DE\u05E4\u05DC\u05D2\u05D5\u05EA \u05D4\u05E4\u05D9\u05E8\u05D0\u05D8\u05D9\u05DD \u05D4\u05D1\u05D9\u05E0\u05DC\u05D0\u05D5\u05DE\u05D9\u05EA (\u05D4\u05E6\u05D4\u05E8\u05EA \u05D4\u05D9\u05E1\u05D5\u05D3 \u05E0\u05DB\u05EA\u05D1\u05D4 \u05D1-2012; \u05DE\u05E4\u05DC\u05D2\u05D5\u05EA \u05D0\u05D7\u05D9\u05D5\u05EA \u05E0\u05D1\u05D7\u05E8\u05D5 \u05DC\u05E4\u05E8\u05DC\u05DE\u05E0\u05D8\u05D9\u05DD \u05D1\u05D0\u05D9\u05E1\u05DC\u05E0\u05D3, \u05E6'\u05DB\u05D9\u05D4, \u05D2\u05E8\u05DE\u05E0\u05D9\u05D4, \u05DC\u05D5\u05E7\u05E1\u05DE\u05D1\u05D5\u05E8\u05D2 \u05D5\u05D4\u05D0\u05D9\u05D7\u05D5\u05D3 \u05D4\u05D0\u05D9\u05E8\u05D5\u05E4\u05D9). \u05DE\u05D0\u05D5\u05DE\u05EA\u05EA \u05D9\u05E9\u05D9\u05E8\u05D5\u05EA \u05DE-gov.il (\u05E4\u05D5\u05E8\u05E1\u05DD 7.9.2026, \u05E2\u05D5\u05D3\u05DB\u05DF 10.9.2026), \u05D5\u05DE\u05E9\u05E0\u05D9 \u05E2\u05DE\u05D5\u05D3\u05D9 \u05DE\u05E6\u05E2 \u05E8\u05E9\u05DE\u05D9\u05D9\u05DD (piratim.org/flag \u05D5-piratim.org/wiki/matza). \u05DE\u05D1\u05E0\u05D4 \u05D4\u05E0\u05D4\u05D2\u05D4 \u05E7\u05D5\u05DC\u05E7\u05D8\u05D9\u05D1\u05D9-\u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9 ("\u05D2\u05E9\u05E8 \u05D4\u05E4\u05D9\u05E7\u05D5\u05D3", "\u05D4\u05E1\u05D9\u05E4\u05D5\u05DF", "\u05D4\u05E1\u05E4\u05D9\u05E0\u05D4"). \u05DE\u05E6\u05E2 \u05DE\u05E4\u05D5\u05E8\u05D8 \u05D1-11 \u05E1\u05E2\u05D9\u05E4\u05D9\u05DD \u05DB\u05D5\u05DC\u05DC: \u05D1\u05D9\u05D8\u05D5\u05DC \u05D0\u05D7\u05D5\u05D6 \u05D4\u05D7\u05E1\u05D9\u05DE\u05D4, \u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D7\u05D9\u05E0\u05DD \u05DC\u05DB\u05D5\u05DC\u05DD, \u05DC\u05D2\u05DC\u05D9\u05D6\u05E6\u05D9\u05D4 \u05DE\u05D5\u05D7\u05DC\u05D8\u05EA \u05E9\u05DC \u05E7\u05E0\u05D0\u05D1\u05D9\u05E1, \u05D5\u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9\u05D4 \u05D4\u05E9\u05EA\u05EA\u05E4\u05D5\u05EA\u05D9\u05EA. \u05E9\u05D9\u05DD \u05DC\u05D1: \u05E4\u05E8\u05E7 "\u05DE\u05DC\u05D7\u05DE\u05D4 \u05D5\u05E9\u05DC\u05D5\u05DD" \u05D1\u05D0\u05EA\u05E8 \u05E2\u05E6\u05DE\u05D5 \u05E0\u05D5\u05EA\u05E8 \u05DB\u05DE\u05E2\u05D8 \u05E8\u05D9\u05E7 \u2014 \u05D4\u05DE\u05E4\u05DC\u05D2\u05D4 \u05DC\u05D0 \u05D2\u05D9\u05D1\u05E9\u05D4 \u05E2\u05DE\u05D3\u05D4 \u05D1\u05D9\u05D8\u05D7\u05D5\u05E0\u05D9\u05EA-\u05DE\u05D3\u05D9\u05E0\u05D9\u05EA \u05DE\u05E4\u05D5\u05E8\u05D8\u05EA.`,
      goals: ['"\u05D3\u05D9\u05E0\u05DE\u05D9\u05E7\u05E8\u05D8\u05D9\u05D4": \u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9\u05D4 \u05E0\u05D6\u05D9\u05DC\u05D4 \u05E9\u05D1\u05D4 \u05E0\u05E6\u05D9\u05D2\u05D9\u05DD \u05DE\u05E6\u05D1\u05D9\u05E2\u05D9\u05DD \u05DC\u05E4\u05D9 \u05D4\u05DB\u05E8\u05E2\u05D5\u05EA \u05D4\u05E6\u05D9\u05D1\u05D5\u05E8, \u05D1\u05E1\u05D9\u05D5\u05E2 \u05D8\u05DB\u05E0\u05D5\u05DC\u05D5\u05D2\u05D9\u05D4', "\u05D7\u05D9\u05E0\u05D5\u05DA \u05D5\u05D1\u05E8\u05D9\u05D0\u05D5\u05EA \u05D7\u05D9\u05E0\u05DD \u05D1\u05DE\u05D5\u05E1\u05D3\u05D5\u05EA \u05DE\u05DE\u05E9\u05DC\u05EA\u05D9\u05D9\u05DD, \u05E2\u05DD \u05E9\u05DB\u05E8 \u05D2\u05D1\u05D5\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05DC\u05E2\u05D5\u05D1\u05D3\u05D9 \u05D4\u05EA\u05D7\u05D5\u05DE\u05D9\u05DD \u05DB\u05E2\u05D3\u05D9\u05E4\u05D5\u05EA \u05DC\u05D0\u05D5\u05DE\u05D9\u05EA", "\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05DE\u05D4\u05D9\u05E8 \u05D5\u05D7\u05D9\u05E0\u05DE\u05D9 \u05DC\u05DB\u05D5\u05DC\u05DD \u05DB\u05D6\u05DB\u05D5\u05EA \u05D3\u05DE\u05D5\u05E7\u05E8\u05D8\u05D9\u05EA \u05D1\u05E1\u05D9\u05E1\u05D9\u05EA, \u05D5\u05E9\u05E7\u05D9\u05E4\u05D5\u05EA \u05DE\u05DC\u05D0\u05D4 \u05E9\u05DC \u05E8\u05E9\u05D5\u05D9\u05D5\u05EA \u05D4\u05E9\u05DC\u05D8\u05D5\u05DF"],

      leader: "\u05E2\u05D5\u05E4\u05E8 \u05DC\u05D9\u05E4\u05E9\u05D9\u05E5 \u05E4\u05D9\u05E0\u05D7\u05E1",
